[package]
name = "project-hostd"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.37"
time = { version = "0.3", features = ["formatting"] }
ureq = { version = "2.12", default-features = false, features = ["json", "tls"] }
url = "2.5"
uuid = { version = "1.18", features = ["v4"] }

[dev-dependencies]
tempfile = "3.21"

[profile.release]
lto = "thin"
strip = true
