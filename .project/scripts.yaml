version: 2
setup:
  - id: dependencies
    command:
      - bun
      - install
      - --frozen-lockfile
servers:
  dev:
    label: Project Space
    command:
      - bun
      - run
      - dev
      - --
      - --host
      - "{host}"
      - --port
      - "{port}"
      - --strictPort
    healthCheck:
      path: /
      timeoutSeconds: 45
  prototype-desktop:
    label: PR desktop prototype
    prototypeSurface: desktop-prototype
    command:
      - bun
      - run
      - serve:prototype:desktop
      - --
      - --host
      - "{host}"
      - --port
      - "{port}"
      - --strictPort
    healthCheck:
      path: /prototype/desktop/
      timeoutSeconds: 45
