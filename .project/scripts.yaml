version: 3
setup:
  - id: dependencies
    command:
      - bun
      - install
      - --frozen-lockfile
commands:
  test:
    command:
      - bun
      - test
      - --isolate
  check:
    command:
      - bun
      - run
      - check
  build:
    command:
      - bun
      - scripts/build-project.ts
  preflight:
    command:
      - bun
      - scripts/ci-preflight.ts
servers:
  dev:
    label: Project Space
    command:
      - bun
      - x
      - vite
      - --host
      - "{host}"
      - --port
      - "{port}"
      - --strictPort
    environment:
      VITE_PROJECT_SPACE_API_BASE_URL: http://127.0.0.1:45873
    healthCheck:
      path: /
      timeoutSeconds: 45
  docs:
    label: Project Space docs
    command:
      - bun
      - apps/docs/node_modules/next/dist/bin/next
      - dev
      - apps/docs
      - --hostname
      - "{host}"
      - --port
      - "{port}"
    healthCheck:
      path: /
      timeoutSeconds: 45
  prototype-desktop:
    label: PR desktop prototype
    prototypeSurface: desktop-prototype
    command:
      - bun
      - x
      - vite
      - --config
      - apps/prototype/vite.config.ts
      - --host
      - "{host}"
      - --port
      - "{port}"
      - --strictPort
    healthCheck:
      path: /prototype/desktop/
      timeoutSeconds: 45
  prototype-mobile:
    label: PR native prototype
    prototypeSurface: mobile-prototype
    command:
      - bun
      - x
      - vite
      - --config
      - apps/prototype/vite.config.ts
      - --host
      - "{host}"
      - --port
      - "{port}"
      - --strictPort
    healthCheck:
      path: /prototype/mobile/
      timeoutSeconds: 45
