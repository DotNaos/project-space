server {
  listen 8080;
  listen [::]:8080;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;

  add_header Cache-Control "private, no-store" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;

  location = /prototype/meta.json {
    try_files $uri =404;
  }

  location = /prototype/desktop {
    return 308 /prototype/desktop/;
  }

  location /prototype/desktop/ {
    try_files $uri $uri/ /prototype/desktop/index.html;
  }

  location = /prototype/mobile {
    return 308 /prototype/mobile/;
  }

  location /prototype/mobile/ {
    try_files $uri $uri/ /prototype/mobile/index.html;
  }

  location / {
    return 404;
  }
}
