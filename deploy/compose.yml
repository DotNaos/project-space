name: project-space

services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-}
    environment:
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      DATABASE_URL: ${DATABASE_URL:-postgres://project_space:${PROJECT_SPACE_POSTGRES_PASSWORD:-project_space}@db:5432/project_space}
      PROJECT_SPACE_ALLOWED_EMAILS: ${PROJECT_SPACE_ALLOWED_EMAILS:-}
      PROJECT_SPACE_ALLOWED_GITHUB_LOGINS: ${PROJECT_SPACE_ALLOWED_GITHUB_LOGINS:-}
      PROJECT_SPACE_AUTH_DISABLED: ${PROJECT_SPACE_AUTH_DISABLED:-}
      PROJECT_SPACE_BACKEND_REPO_PATH: ${PROJECT_SPACE_BACKEND_REPO_PATH:-/workspace/backend-repo}
      PROJECT_SPACE_BUILD_COMMIT: ${PROJECT_SPACE_BUILD_COMMIT:-}
      PROJECT_SPACE_BUILD_NAME: ${PROJECT_SPACE_BUILD_NAME:-project-space}
      PROJECT_SPACE_BUILD_REF: ${PROJECT_SPACE_BUILD_REF:-}
      PROJECT_SPACE_BUILD_TIME: ${PROJECT_SPACE_BUILD_TIME:-}
      PROJECT_SPACE_BUILD_VERSION: ${PROJECT_SPACE_BUILD_VERSION:-}
      PROJECT_SPACE_PRIVATE_VPS_BASE_URL: ${PROJECT_SPACE_PRIVATE_VPS_BASE_URL:-}
      PROJECT_CONNECTOR_REGISTRATION_TOKEN: ${PROJECT_CONNECTOR_REGISTRATION_TOKEN:-}
      PROJECT_CONNECTOR_SERVICE_NAME: ${PROJECT_COMPOSE_NAME:-project-space-prod}-web
    image: project-space-web:local
    restart: unless-stopped
    volumes:
      - ..:/workspace/backend-repo:ro
      - ../ssh:/root/.ssh:ro
    depends_on:
      db:
        condition: service_healthy

  docs:
    build:
      context: ..
      dockerfile: apps/docs/Dockerfile
    image: project-space-docs:local
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${PROJECT_SPACE_POSTGRES_DB:-project_space}
      POSTGRES_PASSWORD: ${PROJECT_SPACE_POSTGRES_PASSWORD:-project_space}
      POSTGRES_USER: ${PROJECT_SPACE_POSTGRES_USER:-project_space}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
