name: project-space

x-runtime-logs: &runtime-logs
  driver: json-file
  options:
    max-file: "5"
    max-size: 20m

services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        PROJECT_SPACE_BUILD_COMMIT: ${PROJECT_SPACE_BUILD_COMMIT:-unknown}
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-}
    environment:
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      DATABASE_URL: ${DATABASE_URL:-postgres://project_space:${PROJECT_SPACE_POSTGRES_PASSWORD:-project_space}@db:5432/project_space}
      PROJECT_SPACE_ALLOWED_EMAILS: ${PROJECT_SPACE_ALLOWED_EMAILS:-}
      PROJECT_SPACE_ALLOWED_GITHUB_LOGINS: ${PROJECT_SPACE_ALLOWED_GITHUB_LOGINS:-}
      PROJECT_SPACE_AUTH_DISABLED: ${PROJECT_SPACE_AUTH_DISABLED:-}
      PROJECT_SPACE_BACKEND_REPO_PATH: ${PROJECT_SPACE_BACKEND_REPO_PATH:-/workspace/backend-repo}
      PROJECT_SPACE_BUILD_COMMIT: ${PROJECT_SPACE_BUILD_COMMIT:-}
      PROJECT_SPACE_BUILD_NAME: ${PROJECT_SPACE_BUILD_NAME:-project-space}
      PROJECT_SPACE_BUILD_REF: ${PROJECT_SPACE_BUILD_REF:-}
      PROJECT_SPACE_BUILD_TIME: ${PROJECT_SPACE_BUILD_TIME:-}
      PROJECT_SPACE_BUILD_VERSION: ${PROJECT_SPACE_BUILD_VERSION:-}
      PROJECT_SPACE_MACHINE_RATE_LIMIT_SECRET: ${PROJECT_SPACE_MACHINE_RATE_LIMIT_SECRET:-}
      PROJECT_SPACE_MACHINE_POWER_CONFIG_ROOT: ${PROJECT_SPACE_MACHINE_POWER_CONFIG_ROOT:-/workspace/backend-repo/config/machine-power}
      PROJECT_SPACE_MACHINE_POWER_MQTT_JETKVM_B46E1A936AC89A4E_PASSWORD: ${PROJECT_SPACE_MACHINE_POWER_MQTT_JETKVM_B46E1A936AC89A4E_PASSWORD:-}
      PROJECT_SPACE_MACHINE_POWER_MQTT_JETKVM_B46E1A936AC89A4E_USERNAME: ${PROJECT_SPACE_MACHINE_POWER_MQTT_JETKVM_B46E1A936AC89A4E_USERNAME:-}
      PROJECT_SPACE_LOG_LEVEL: ${PROJECT_SPACE_LOG_LEVEL:-info}
      PROJECT_SPACE_CONNECTOR_APPROVED_RELEASE_ID: v${PROJECT_SPACE_BUILD_VERSION:-}
      PROJECT_SPACE_PRIVATE_VPS_BASE_URL: ${PROJECT_SPACE_PRIVATE_VPS_BASE_URL:-}
      PROJECT_SPACE_PUBLIC_ORIGIN: https://${PROJECT_DOMAIN:-projects.os-home.net}
      PROJECT_SPACE_PREVIEW_STATUS_ROOT: /workspace/deploy-state/project-space-preview
      PROJECT_CONNECTOR_REGISTRATION_TOKEN: ${PROJECT_CONNECTOR_REGISTRATION_TOKEN:-}
      PROJECT_CONNECTOR_COMMAND_SIGNING_PRIVATE_KEY_B64: ${PROJECT_CONNECTOR_COMMAND_SIGNING_PRIVATE_KEY_B64:-}
      PROJECT_RELEASE_MANIFEST_SIGNING_PUBLIC_KEY_B64: ${PROJECT_RELEASE_MANIFEST_SIGNING_PUBLIC_KEY_B64:-}
      PROJECT_CONNECTOR_SERVICE_NAME: ${PROJECT_COMPOSE_NAME:-project-space-prod}-web
      PROJECT_DEPLOY_ENVIRONMENT: ${PROJECT_ENV:-prod}
      PROJECT_DEPLOY_STATE_ROOT: /workspace/deploy-state
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      OTEL_LOG_LEVEL: ${OTEL_LOG_LEVEL:-error}
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-project-space}
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-}
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:4173/api/health'); const b=await r.json(); if(!r.ok||b.ok!==true) process.exit(1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    image: project-space-web:${PROJECT_SPACE_BUILD_COMMIT:-local}
    logging: *runtime-logs
    restart: unless-stopped
    volumes:
      - ..:/workspace/backend-repo:ro
      - /opt/platform/state:/workspace/deploy-state:ro
      - ../ssh:/root/.ssh:ro
    depends_on:
      db:
        condition: service_healthy

  docs:
    build:
      context: ..
      dockerfile: apps/docs/Dockerfile
      args:
        PROJECT_SPACE_BUILD_COMMIT: ${PROJECT_SPACE_BUILD_COMMIT:-unknown}
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:3000/'); if(!r.ok) process.exit(1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    image: project-space-docs:${PROJECT_SPACE_BUILD_COMMIT:-local}
    logging: *runtime-logs
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${PROJECT_SPACE_POSTGRES_DB:-project_space}
      POSTGRES_PASSWORD: ${PROJECT_SPACE_POSTGRES_PASSWORD:-project_space}
      POSTGRES_USER: ${PROJECT_SPACE_POSTGRES_USER:-project_space}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *runtime-logs
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
