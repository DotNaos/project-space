name: Validate release source
description: Classify and run the source-level release quality gates.
inputs:
  base-sha:
    description: Exact pull request base SHA
    required: false
  event-name:
    description: GitHub event name
    required: true
  head-sha:
    description: Exact source SHA
    required: true
  ref-name:
    description: GitHub ref name
    required: true
  ref-type:
    description: GitHub ref type
    required: true
outputs:
  full-matrix:
    value: ${{ steps.metadata.outputs.full-matrix }}
  policy-reason:
    value: ${{ steps.metadata.outputs.policy-reason }}
  version:
    value: ${{ steps.metadata.outputs.version }}
runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version-file: go.mod
        cache: true
    - name: Set up Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: 1.3.14
    - name: Resolve release verification policy
      id: metadata
      shell: bash
      env:
        BASE_SHA: ${{ inputs.base-sha }}
        EVENT_NAME: ${{ inputs.event-name }}
        HEAD_SHA: ${{ inputs.head-sha }}
        REF_NAME: ${{ inputs.ref-name }}
        REF_TYPE: ${{ inputs.ref-type }}
      run: |
        set -euo pipefail
        policy=$(bun scripts/release-verification-policy.ts \
          --event "$EVENT_NAME" --base "$BASE_SHA" --head "$HEAD_SHA")
        version=$(git show "$HEAD_SHA:package.json" | jq -er '.version')
        if [[ "$REF_TYPE" == tag && "$REF_NAME" != "v${version}" ]]; then
          echo "Tag $REF_NAME does not match package.json version $version." >&2
          exit 65
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "full-matrix=$(jq -r '.fullMatrix' <<<"$policy")" >> "$GITHUB_OUTPUT"
        echo "policy-reason=$(jq -r '.reason' <<<"$policy")" >> "$GITHUB_OUTPUT"
        printf 'Verification mode: `%s` — %s\n' \
          "$(jq -r '.mode' <<<"$policy")" \
          "$(jq -r '.reason' <<<"$policy")" >> "$GITHUB_STEP_SUMMARY"
    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
    - name: Test and build TypeScript
      shell: bash
      run: |
        bun run check
        bun test --isolate
        bun run build
    - name: Test and vet Go
      shell: bash
      run: |
        go test -race ./...
        go vet ./...
