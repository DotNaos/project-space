name: Classify release source
description: Validate the exact source and select the required release verification matrix.
inputs:
  base-sha:
    description: Exact pull request base SHA
    required: false
  event-name:
    description: GitHub event name
    required: true
  head-sha:
    description: Exact source SHA
    required: true
  ref-name:
    description: GitHub ref name
    required: true
  ref-type:
    description: GitHub ref type
    required: true
outputs:
  full-matrix:
    value: ${{ steps.metadata.outputs.full-matrix }}
  policy-reason:
    value: ${{ steps.metadata.outputs.policy-reason }}
  version:
    value: ${{ steps.metadata.outputs.version }}
runs:
  using: composite
  steps:
    - name: Set up Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: 1.3.14
    - name: Resolve release verification policy
      id: metadata
      shell: bash
      env:
        BASE_SHA: ${{ inputs.base-sha }}
        EVENT_NAME: ${{ inputs.event-name }}
        HEAD_SHA: ${{ inputs.head-sha }}
        REF_NAME: ${{ inputs.ref-name }}
        REF_TYPE: ${{ inputs.ref-type }}
      run: |
        set -euo pipefail
        policy=$(bun scripts/release-verification-policy.ts \
          --event "$EVENT_NAME" --base "$BASE_SHA" --head "$HEAD_SHA")
        if [[ "$REF_TYPE" == tag ]]; then
          if [[ ! "$REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag $REF_NAME is not an exact stable semantic version." >&2
            exit 65
          fi
          version=${REF_NAME#v}
        else
          version=$(git show "$HEAD_SHA:package.json" | jq -er '.version')
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "full-matrix=$(jq -r '.fullMatrix' <<<"$policy")" >> "$GITHUB_OUTPUT"
        echo "policy-reason=$(jq -r '.reason' <<<"$policy")" >> "$GITHUB_OUTPUT"
        printf 'Verification mode: `%s` — %s\n' \
          "$(jq -r '.mode' <<<"$policy")" \
          "$(jq -r '.reason' <<<"$policy")" >> "$GITHUB_STEP_SUMMARY"
