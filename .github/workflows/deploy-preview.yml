name: Deploy PR preview
run-name: Preview ${{ inputs.action || 'build' }} PR #${{ inputs.pr || github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number }} · ${{ inputs.operation_id || github.event.workflow_run.id || github.event.action }}
on:
  workflow_dispatch:
    inputs:
      action:
        description: Preview lifecycle action
        required: true
        default: deploy
        type: choice
        options: [build, start, stop, touch, deploy, destroy]
      pr:
        description: Pull request number
        required: true
        type: string
      requested_head_sha:
        description: Exact PR head captured by the trusted CLI
        required: false
        type: string
      inventory_revision:
        description: Current inventory revision for an explicit replacement
        required: false
        type: string
      replacement_pr:
        description: Explicitly selected online Preview to stop at capacity
        required: false
        type: string
      replacement_repository:
        description: Repository of the selected online Preview
        required: false
        type: string
      replacement_head_sha:
        description: Exact head of the selected online Preview
        required: false
        type: string
      operation_id:
        description: Unique CLI operation identifier
        required: true
        type: string
  workflow_run:
    workflows: [Build PR preview artifacts]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: project-space-preview-pr-${{ inputs.pr || github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number }}
  cancel-in-progress: false
env:
  PREVIEW_REPOSITORY: DotNaos/project-space
jobs:
  resolve:
    name: Resolve exact open PR head and immutable build artifact
    if: (github.event_name == 'workflow_dispatch' && contains(fromJSON('["build","start","stop","touch","deploy"]'), inputs.action)) || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      disposition: ${{ steps.pull-request.outputs.disposition }}
      head_sha: ${{ steps.pull-request.outputs.head_sha }}
      pr_number: ${{ steps.pull-request.outputs.pr_number }}
      artifact_digest: ${{ steps.pull-request.outputs.artifact_digest }}
      artifact_id: ${{ steps.pull-request.outputs.artifact_id }}
      artifact_name: ${{ steps.pull-request.outputs.artifact_name }}
      artifact_size: ${{ steps.pull-request.outputs.artifact_size }}
      source_run_attempt: ${{ steps.pull-request.outputs.source_run_attempt }}
      source_run_id: ${{ steps.pull-request.outputs.source_run_id }}
      source_workflow_ref: ${{ steps.pull-request.outputs.source_workflow_ref }}
    steps:
      - name: Validate caller and current PR
        id: pull-request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION_ID: ${{ inputs.operation_id }}
          REQUESTED_PR: ${{ inputs.pr || github.event.workflow_run.pull_requests[0].number }}
          REQUESTED_HEAD_SHA: ${{ inputs.requested_head_sha || github.event.workflow_run.head_sha }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]] || {
            echo 'Preview workflow must be dispatched from trusted main.' >&2
            exit 64
          }
          [[ "$REQUESTED_PR" =~ ^[1-9][0-9]*$ ]] || {
            echo 'Pull request number must be a positive integer.' >&2
            exit 64
          }
          [[ "$GITHUB_EVENT_NAME" == workflow_run || "$OPERATION_ID" =~ ^preview-[0-9a-f]{32}$ ]] || {
            echo 'Operation ID must match preview-<32 lowercase hex>.' >&2
            exit 64
          }
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            permission=$(gh api "repos/$PREVIEW_REPOSITORY/collaborators/$GITHUB_ACTOR/permission" --jq .permission)
            case "$permission" in admin|maintain|write) ;; *) echo 'Preview dispatch requires repository write permission.' >&2; exit 77;; esac
          fi
          pr_json=$(gh api "repos/$PREVIEW_REPOSITORY/pulls/$REQUESTED_PR")
          jq -e --arg repository "$PREVIEW_REPOSITORY" '
            .base.ref == "main" and .base.repo.full_name == $repository and
            .head.repo.full_name == $repository and
            (.state == "open" or .state == "closed")
          ' <<<"$pr_json" >/dev/null
          head_sha=$(jq -er '.head.sha | select(test("^[0-9a-f]{40}$"))' <<<"$pr_json")
          state=$(jq -er '.state' <<<"$pr_json")
          if [[ -n "$REQUESTED_HEAD_SHA" ]]; then
            [[ "$REQUESTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || {
              echo 'Requested Preview head must be a full lowercase Git SHA.' >&2
              exit 64
            }
          fi
          if [[ "$state" == closed ]]; then
            echo 'disposition=closed' >> "$GITHUB_OUTPUT"
            echo "head_sha=$REQUESTED_HEAD_SHA" >> "$GITHUB_OUTPUT"
            echo "pr_number=$REQUESTED_PR" >> "$GITHUB_OUTPUT"
            echo 'The pull request closed before Preview work began; no Preview transaction will run.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ -n "$REQUESTED_HEAD_SHA" && "$head_sha" != "$REQUESTED_HEAD_SHA" ]]; then
            echo 'disposition=superseded' >> "$GITHUB_OUTPUT"
            echo "head_sha=$REQUESTED_HEAD_SHA" >> "$GITHUB_OUTPUT"
            echo "pr_number=$REQUESTED_PR" >> "$GITHUB_OUTPUT"
            echo 'This Preview revision was superseded before work began; no outdated head will run.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo 'disposition=current' >> "$GITHUB_OUTPUT"
          echo "pr_number=$REQUESTED_PR" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
            source_run_id="$TRIGGER_RUN_ID"
          elif [[ "${{ inputs.action }}" == build || "${{ inputs.action }}" == deploy ]]; then
            source_run_id=$(gh api \
              "repos/$PREVIEW_REPOSITORY/actions/workflows/build-preview-artifacts.yml/runs?event=pull_request&head_sha=$head_sha&status=completed&per_page=100" |
              jq -r --argjson pr "$REQUESTED_PR" \
                '[.workflow_runs[] | select(.conclusion == "success" and any(.pull_requests[]?; .number == $pr)) | .id] | first // empty')
          else
            exit 0
          fi
          [[ "$source_run_id" =~ ^[1-9][0-9]*$ ]] || {
            echo 'No successful exact-head Preview artifact build exists yet.' >&2
            exit 69
          }
          run_json=$(gh api "repos/$PREVIEW_REPOSITORY/actions/runs/$source_run_id")
          jq -e \
            --arg repository "$PREVIEW_REPOSITORY" \
            --arg sha "$head_sha" \
            --argjson pr "$REQUESTED_PR" \
            --argjson repository_id "$GITHUB_REPOSITORY_ID" '
              .event == "pull_request" and .conclusion == "success" and
              .head_sha == $sha and .repository.full_name == $repository and
              .repository.id == $repository_id and
              .path == ".github/workflows/build-preview-artifacts.yml" and
              any(.pull_requests[]?; .number == $pr and .head.sha == $sha and
                .head.repo.id == $repository_id)
            ' <<<"$run_json" >/dev/null
          source_run_attempt=$(jq -er '.run_attempt | select(type == "number" and . > 0)' <<<"$run_json")
          artifact_name="preview-images-pr-$REQUESTED_PR-$head_sha-$source_run_id-$source_run_attempt"
          artifacts=$(gh api "repos/$PREVIEW_REPOSITORY/actions/runs/$source_run_id/artifacts?per_page=100")
          artifact=$(jq -ec --arg name "$artifact_name" '
            [.artifacts[] | select(.name == $name and .expired == false)]
            | select(length == 1) | .[0]
          ' <<<"$artifacts")
          artifact_id=$(jq -er '.id | select(type == "number" and . > 0)' <<<"$artifact")
          artifact_size=$(jq -er '.size_in_bytes | select(type == "number" and . > 0)' <<<"$artifact")
          artifact_digest=$(jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))' <<<"$artifact")
          source_workflow_ref="$PREVIEW_REPOSITORY/.github/workflows/build-preview-artifacts.yml@refs/pull/$REQUESTED_PR/merge"
          echo "artifact_digest=$artifact_digest" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "artifact_size=$artifact_size" >> "$GITHUB_OUTPUT"
          echo "source_run_attempt=$source_run_attempt" >> "$GITHUB_OUTPUT"
          echo "source_run_id=$source_run_id" >> "$GITHUB_OUTPUT"
          echo "source_workflow_ref=$source_workflow_ref" >> "$GITHUB_OUTPUT"
  promote:
    needs: resolve
    if: needs.resolve.outputs.disposition == 'current' && ((github.event_name == 'workflow_dispatch' && contains(fromJSON('["build","deploy"]'), inputs.action)) || github.event_name == 'workflow_run')
    permissions:
      actions: read
      attestations: read
      contents: read
      packages: write
    uses: ./.github/workflows/promote-preview-artifacts.yml
    with:
      artifact_digest: ${{ needs.resolve.outputs.artifact_digest }}
      artifact_id: ${{ needs.resolve.outputs.artifact_id }}
      artifact_name: ${{ needs.resolve.outputs.artifact_name }}
      artifact_size: ${{ needs.resolve.outputs.artifact_size }}
      head_sha: ${{ needs.resolve.outputs.head_sha }}
      pr_number: ${{ needs.resolve.outputs.pr_number }}
      source_run_attempt: ${{ needs.resolve.outputs.source_run_attempt }}
      source_run_id: ${{ needs.resolve.outputs.source_run_id }}
      source_workflow_ref: ${{ needs.resolve.outputs.source_workflow_ref }}
      trusted_sha: ${{ github.workflow_sha }}
  deploy:
    name: Deploy exact PR head through trusted Preview runner
    needs: [resolve, promote]
    if: needs.resolve.outputs.disposition == 'current' && ((github.event_name == 'workflow_dispatch' && contains(fromJSON('["build","deploy"]'), inputs.action)) || github.event_name == 'workflow_run')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: Preview
      url: https://pr-${{ needs.resolve.outputs.pr_number }}.projects.os-home.net
    permissions:
      contents: read
      deployments: write
      pull-requests: read
    steps:
      - name: Revalidate exact PR head before VPS handoff
        id: freshness
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          REQUESTED_SHA: ${{ needs.resolve.outputs.head_sha }}
        run: |
          set -euo pipefail
          pr_json=$(gh api "repos/$PREVIEW_REPOSITORY/pulls/$PR_NUMBER")
          jq -e --arg repository "$PREVIEW_REPOSITORY" '
            .base.ref == "main" and .base.repo.full_name == $repository and
            .head.repo.full_name == $repository and
            (.state == "open" or .state == "closed") and
            (.head.sha | test("^[0-9a-f]{40}$"))
          ' <<<"$pr_json" >/dev/null
          if jq -e --arg sha "$REQUESTED_SHA" '
            .state == "open" and .head.sha == $sha
          ' <<<"$pr_json" >/dev/null; then
            echo 'disposition=current' >> "$GITHUB_OUTPUT"
          else
            echo 'disposition=superseded' >> "$GITHUB_OUTPUT"
            echo 'The pull request closed or advanced before credential handoff; no outdated Preview transaction will run.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Create transient GitHub deployment
        if: steps.freshness.outputs.disposition == 'current' && inputs.action == 'deploy'
        id: github-deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          REQUESTED_SHA: ${{ needs.resolve.outputs.head_sha }}
        run: |
          set -euo pipefail
          deployment=$(gh api --method POST "repos/$PREVIEW_REPOSITORY/deployments" --input - <<JSON
          {"ref":"$REQUESTED_SHA","environment":"preview/pr-$PR_NUMBER","auto_merge":false,
           "required_contexts":[],"transient_environment":true,"production_environment":false,
           "description":"Project Space PR #$PR_NUMBER preview"}
          JSON
          )
          deployment_id=$(jq -er '.id' <<<"$deployment")
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
          gh api --method POST "repos/$PREVIEW_REPOSITORY/deployments/$deployment_id/statuses" --input - <<JSON
          {"state":"in_progress","environment":"preview/pr-$PR_NUMBER","auto_inactive":false,
           "log_url":"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"}
          JSON
      - name: Load Preview-only controller credentials
        if: steps.freshness.outputs.disposition == 'current'
        id: preview-secrets
        uses: 1password/load-secrets-action@3a12b0ab99d9cd590a3e9b5a90ea017210ed9556 # v4
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          SSH_PRIVATE_KEY: op://projects/Project Space Preview Deploy SSH/private_key
          TS_OAUTH_CLIENT_ID: op://projects/Project Space Preview Tailscale CI Client ID/credential
          TS_OAUTH_SECRET: op://projects/Project Space Preview Tailscale CI Secret/credential
      - name: Configure forced-command Preview SSH identity
        if: steps.freshness.outputs.disposition == 'current'
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ steps.preview-secrets.outputs.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/project-space-preview"
          printf '%s\n' '${{ vars.PROJECT_SPACE_PREVIEW_SSH_KNOWN_HOSTS }}' > "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<SSH_CONFIG
          Host project-space-preview
            HostName ${{ vars.PROJECT_SPACE_PREVIEW_DEPLOY_IP }}
            User preview-deploy
            IdentityFile ~/.ssh/project-space-preview
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            ForwardAgent no
            ForwardX11 no
            BatchMode yes
            PasswordAuthentication no
            KbdInteractiveAuthentication no
          SSH_CONFIG
          chmod 600 "$HOME/.ssh/config" "$HOME/.ssh/known_hosts" "$HOME/.ssh/project-space-preview"
      - name: Connect ephemeral Preview CI identity to Tailscale
        if: steps.freshness.outputs.disposition == 'current'
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          oauth-client-id: ${{ steps.preview-secrets.outputs.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ steps.preview-secrets.outputs.TS_OAUTH_SECRET }}
          tags: tag:ci-project-space-preview
          ping: ${{ vars.PROJECT_SPACE_PREVIEW_DEPLOY_IP }}
      - name: Apply trusted Preview transaction
        id: apply
        if: steps.freshness.outputs.disposition == 'current'
        shell: bash
        env:
          DOCS_DIGEST: ${{ needs.promote.outputs.docs_digest }}
          GATEWAY_DIGEST: ${{ needs.promote.outputs.gateway_digest }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          PROTOTYPE_DIGEST: ${{ needs.promote.outputs.prototype_digest }}
          REQUESTED_SHA: ${{ needs.resolve.outputs.head_sha }}
          WEB_DIGEST: ${{ needs.promote.outputs.web_digest }}
        run: |
          set +e
          runner_command=apply
          runner_mode=online
          if [[ "${{ inputs.action }}" == build || "${{ github.event_name }}" == workflow_run ]]; then runner_command=register; runner_mode=register; fi
          jq -n \
            --arg repository "$PREVIEW_REPOSITORY" --argjson pr "$PR_NUMBER" --arg sha "$REQUESTED_SHA" \
            --arg mode "$runner_mode" \
            --arg web "ghcr.io/dotnaos/project-space-preview-web@$WEB_DIGEST" \
            --arg docs "ghcr.io/dotnaos/project-space-preview-docs@$DOCS_DIGEST" \
            --arg gateway "ghcr.io/dotnaos/project-space-preview-gateway@$GATEWAY_DIGEST" \
            --arg prototype "ghcr.io/dotnaos/project-space-preview-prototype@$PROTOTYPE_DIGEST" \
            '{repository:$repository,prNumber:$pr,headSha:$sha,mode:$mode,webImage:$web,docsImage:$docs,
              gatewayImage:$gateway,prototypeImage:$prototype}' |
            ssh project-space-preview "$runner_command" > preview-output.log 2> preview-error.log
          exit_code=$?
          set -e
          sed -E \
            -e 's/([A-Za-z0-9_]*(TOKEN|PASSWORD|SECRET|PRIVATE_KEY)[A-Za-z0-9_]*)=[^[:space:]]+/\1=[REDACTED]/Ig' \
            -e 's/(Bearer|Basic)[[:space:]]+[A-Za-z0-9._~+\/=-]+/\1 [REDACTED]/Ig' \
            preview-error.log | tail -n 40 > preview-error.sanitized.log
          receipt_valid=false
          if jq -Rsce --arg prefix 'PROJECT_SPACE_PREVIEW_RECEIPT=' '
            split("\n")
            | map(select(startswith($prefix)) | ltrimstr($prefix))
            | select(length == 1)
            | .[0]
            | fromjson
            | select(type == "object")
          ' preview-output.log > preview-result.json; then
            receipt_valid=true
          else
            : > preview-result.json
          fi
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          echo "receipt_valid=$receipt_valid" >> "$GITHUB_OUTPUT"
      - name: Classify exact-head state after runner handoff
        id: handoff
        if: always() && steps.freshness.outputs.disposition == 'current'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          REQUESTED_SHA: ${{ needs.resolve.outputs.head_sha }}
          RUNNER_EXIT_CODE: ${{ steps.apply.outputs.exit_code }}
        run: |
          set -euo pipefail
          pr_json=$(gh api "repos/$PREVIEW_REPOSITORY/pulls/$PR_NUMBER")
          jq -e --arg repository "$PREVIEW_REPOSITORY" '
            .base.ref == "main" and .base.repo.full_name == $repository and
            .head.repo.full_name == $repository and
            (.state == "open" or .state == "closed") and
            (.head.sha | test("^[0-9a-f]{40}$"))
          ' <<<"$pr_json" >/dev/null
          if jq -e --arg sha "$REQUESTED_SHA" '
            .state == "open" and .head.sha == $sha
          ' <<<"$pr_json" >/dev/null; then
            echo 'disposition=current' >> "$GITHUB_OUTPUT"
          elif [[ "$RUNNER_EXIT_CODE" == 75 ]]; then
            echo 'disposition=superseded' >> "$GITHUB_OUTPUT"
            echo 'The runner refused a positively superseded exact head; this is not a product regression.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'disposition=unsafe-supersession' >> "$GITHUB_OUTPUT"
          fi
      - name: Publish GitHub deployment result
        if: always() && steps.freshness.outputs.disposition == 'current' && inputs.action == 'deploy'
        shell: bash
        env:
          DEPLOYMENT_ID: ${{ steps.github-deployment.outputs.deployment_id }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          REQUESTED_SHA: ${{ needs.resolve.outputs.head_sha }}
          RUNNER_EXIT_CODE: ${{ steps.apply.outputs.exit_code }}
          RUNNER_RECEIPT_VALID: ${{ steps.apply.outputs.receipt_valid }}
        run: |
          set -euo pipefail
          state=failure
          transition_state=failed
          failure_class=infrastructure_failure
          error_code=preview_infrastructure_failure
          description='Preview deployment failed.'
          summary='The trusted Preview runner failed without valid exact-head evidence.'
          if [[ "${{ steps.handoff.outcome }}" != success ]]; then
            failure_class=application_regression
            error_code=preview_supersession_fence_failed
            summary='The post-run exact-head fence could not be proven; success is forbidden.'
          elif [[ "${{ steps.handoff.outputs.disposition }}" == superseded ]]; then
            state=inactive
            transition_state=superseded
            failure_class=none
            error_code=preview_superseded
            description='Preview revision superseded; no outdated head was deployed.'
            summary='The runner positively refused the outdated exact head.'
          elif [[ "${{ steps.handoff.outputs.disposition }}" != current ]]; then
            failure_class=application_regression
            error_code=preview_supersession_fence_failed
            summary='The pull request advanced without a positive runner supersession refusal, or exact-head evidence was incomplete.'
          elif [[ "$RUNNER_EXIT_CODE" == 0 && "$RUNNER_RECEIPT_VALID" == true ]] && jq -e \
            --arg repository "$PREVIEW_REPOSITORY" \
            --argjson pr "$PR_NUMBER" \
            --arg sha "$REQUESTED_SHA" \
            '.state == "online" and
             .repositoryFullName == $repository and
             .pullRequestNumber == $pr and
             .requestedSha == $sha and
             .runningSha == $sha and
             .prototypeMetaSha == $sha' \
            preview-result.json >/dev/null; then
            state=success
            transition_state=ready
            failure_class=none
            error_code=preview_ready
            description='Exact PR head is live and verified.'
            summary='Exact PR head, public hostname, certificate, and runtime identity are verified.'
          elif [[ "$RUNNER_EXIT_CODE" == 73 && "$RUNNER_RECEIPT_VALID" == true ]] && jq -e \
            --arg repository "$PREVIEW_REPOSITORY" \
            --argjson pr "$PR_NUMBER" \
            --arg sha "$REQUESTED_SHA" \
            '.state == "blocked_capacity" and
             (.errorCode == "preview_quota_full" or .errorCode == "preview_storage_low") and
             .repositoryFullName == $repository and
             .pullRequestNumber == $pr and
             .requestedSha == $sha' \
            preview-result.json >/dev/null; then
            state=pending
            transition_state=blocked_capacity
            failure_class=capacity_block
            error_code=$(jq -r '.errorCode' preview-result.json)
            description='Blocked by Preview capacity; no product regression.'
            summary=$(jq -r '.message' preview-result.json)
          elif [[ "$RUNNER_EXIT_CODE" == 64 || "$RUNNER_EXIT_CODE" == 75 ]]; then
            failure_class=invalid_change
            error_code=preview_invalid_change
          elif [[ "$RUNNER_EXIT_CODE" == 69 || "$RUNNER_EXIT_CODE" == 70 ||
                  "$RUNNER_EXIT_CODE" == 71 || "$RUNNER_EXIT_CODE" == 73 ||
                  "$RUNNER_EXIT_CODE" == 78 ]]; then
            failure_class=infrastructure_failure
            error_code=preview_infrastructure_failure
          fi
          jq -n \
            --arg errorCode "$error_code" \
            --arg failureClass "$failure_class" \
            --arg state "$transition_state" \
            --arg summary "$summary" \
            --arg repository "$PREVIEW_REPOSITORY" \
            --argjson pr "$PR_NUMBER" \
            --arg requestedSha "$REQUESTED_SHA" \
            '{errorCode:$errorCode,failureClass:$failureClass,state:$state,summary:$summary,
              repositoryFullName:$repository,pullRequestNumber:$pr,
              requestedSha:$requestedSha}' \
            > preview-transition.json
          printf 'Transition code: `%s`\n\nSummary: %s\n' \
            "$error_code" "$summary" >> "$GITHUB_STEP_SUMMARY"
          gh api --method POST "repos/$PREVIEW_REPOSITORY/deployments/$DEPLOYMENT_ID/statuses" --input - <<JSON
          {"state":"$state","environment":"preview/pr-$PR_NUMBER","auto_inactive":true,
           "environment_url":"https://pr-$PR_NUMBER.projects.os-home.net",
           "log_url":"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID","description":"$description"}
          JSON
          [[ "$state" == success || "$state" == pending || "$state" == inactive ]]
      - name: Verify offline Preview registration
        if: steps.handoff.outputs.disposition == 'current' && (inputs.action == 'build' || github.event_name == 'workflow_run')
        shell: bash
        env:
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          REQUESTED_SHA: ${{ needs.resolve.outputs.head_sha }}
          RUNNER_EXIT_CODE: ${{ steps.apply.outputs.exit_code }}
          RUNNER_RECEIPT_VALID: ${{ steps.apply.outputs.receipt_valid }}
        run: |
          set -euo pipefail
          [[ "$RUNNER_EXIT_CODE" == 0 && "$RUNNER_RECEIPT_VALID" == true ]] || {
            echo 'Trusted Preview registration did not produce a valid receipt.' >&2
            exit 72
          }
          jq -e \
            --arg repository "$PREVIEW_REPOSITORY" \
            --argjson pr "$PR_NUMBER" \
            --arg sha "$REQUESTED_SHA" \
            '.state == "ready" and
             .repositoryFullName == $repository and
             .pullRequestNumber == $pr and
             .requestedSha == $sha and
             (.runningSha == null or .runningSha == "") and
             .prototypeHealthy == false' preview-result.json >/dev/null
      - name: Record neutral superseded registration
        if: steps.handoff.outputs.disposition == 'superseded' && (inputs.action == 'build' || github.event_name == 'workflow_run')
        run: echo 'Superseded exact head was positively refused; no outdated Preview was registered.' >> "$GITHUB_STEP_SUMMARY"
      - name: Fail closed when the supersession fence is not proven
        if: steps.handoff.outputs.disposition == 'unsafe-supersession'
        run: |
          echo 'The Preview supersession fence was not positively proven.' >&2
          exit 1
      - name: Upload sanitized Preview transition evidence
        if: always() && steps.freshness.outputs.disposition == 'current' && inputs.action == 'deploy'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-transition-${{ needs.resolve.outputs.pr_number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            preview-result.json
            preview-transition.json
            preview-error.sanitized.log
          if-no-files-found: error
          retention-days: 14
  lifecycle:
    name: Explicitly start or stop a registered Preview
    needs: resolve
    if: needs.resolve.outputs.disposition == 'current' && github.event_name == 'workflow_dispatch' && contains(fromJSON('["start","stop","touch"]'), inputs.action)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: Preview
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Load Preview-only controller credentials
        id: preview-secrets
        uses: 1password/load-secrets-action@3a12b0ab99d9cd590a3e9b5a90ea017210ed9556 # v4
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          SSH_PRIVATE_KEY: op://projects/Project Space Preview Deploy SSH/private_key
          TS_OAUTH_CLIENT_ID: op://projects/Project Space Preview Tailscale CI Client ID/credential
          TS_OAUTH_SECRET: op://projects/Project Space Preview Tailscale CI Secret/credential
      - name: Configure forced-command Preview SSH identity
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ steps.preview-secrets.outputs.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/project-space-preview"
          printf '%s\n' '${{ vars.PROJECT_SPACE_PREVIEW_SSH_KNOWN_HOSTS }}' > "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<SSH_CONFIG
          Host project-space-preview
            HostName ${{ vars.PROJECT_SPACE_PREVIEW_DEPLOY_IP }}
            User preview-deploy
            IdentityFile ~/.ssh/project-space-preview
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            ForwardAgent no
            ForwardX11 no
            BatchMode yes
            PasswordAuthentication no
            KbdInteractiveAuthentication no
          SSH_CONFIG
          chmod 600 "$HOME/.ssh/config" "$HOME/.ssh/known_hosts" "$HOME/.ssh/project-space-preview"
      - name: Connect ephemeral Preview CI identity to Tailscale
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          oauth-client-id: ${{ steps.preview-secrets.outputs.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ steps.preview-secrets.outputs.TS_OAUTH_SECRET }}
          tags: tag:ci-project-space-preview
          ping: ${{ vars.PROJECT_SPACE_PREVIEW_DEPLOY_IP }}
      - name: Apply explicit lifecycle transition
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
          INVENTORY_REVISION: ${{ inputs.inventory_revision }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          REQUESTED_HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          REPLACEMENT_HEAD_SHA: ${{ inputs.replacement_head_sha }}
          REPLACEMENT_PR: ${{ inputs.replacement_pr }}
          REPLACEMENT_REPOSITORY: ${{ inputs.replacement_repository }}
        run: |
          set -euo pipefail
          jq -n --arg repository "$PREVIEW_REPOSITORY" --argjson pr "$PR_NUMBER" \
            --arg headSha "$REQUESTED_HEAD_SHA" --arg inventoryRevision "$INVENTORY_REVISION" \
            --arg replacementHeadSha "$REPLACEMENT_HEAD_SHA" --arg replacementRepository "$REPLACEMENT_REPOSITORY" \
            --argjson replacementPr "${REPLACEMENT_PR:-null}" \
            '{repository:$repository,prNumber:$pr,headSha:$headSha,requestedHeadSha:$headSha,
              inventoryRevision:($inventoryRevision // null),
              selectedReplacementPullRequestNumber:$replacementPr,
              selectedReplacementRepositoryFullName:($replacementRepository // null),
              selectedReplacementHeadSha:($replacementHeadSha // null)}' |
          ssh project-space-preview "$ACTION" | tee lifecycle-output.log
          jq -Rsce --arg prefix 'PROJECT_SPACE_PREVIEW_RECEIPT=' '
            split("\n")
            | map(select(startswith($prefix)) | ltrimstr($prefix))
            | select(length == 1)
            | .[0]
            | fromjson
            | select(type == "object")
          ' lifecycle-output.log > lifecycle-result.json
          jq -e \
            --arg action "$ACTION" \
            --arg repository "$PREVIEW_REPOSITORY" \
            --argjson pr "$PR_NUMBER" \
            --arg sha "$REQUESTED_HEAD_SHA" \
            '.repositoryFullName == $repository and
             .pullRequestNumber == $pr and
             .requestedSha == $sha and
             if $action == "start" then
               .state == "online" and .runningSha == $sha and
               .prototypeHealthy == true and .composeHealthy == true and
               .httpHealthy == true and .liveOriginHealthy == true
             elif $action == "stop" then
               .state == "ready" and .runningSha == null and .prototypeHealthy == false
             elif $action == "touch" then
               .state == "online" and .runningSha == $sha and
             (.activityLeaseExpiresAt | type == "string" and length > 0)
             else false end' lifecycle-result.json >/dev/null
  manual-destroy:
    name: Manually remove exact PR preview
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: Preview
    permissions:
      contents: read
      deployments: write
      pull-requests: read
    steps:
      - name: Validate destroy request and caller
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION_ID: ${{ inputs.operation_id }}
          PR_NUMBER: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]] || exit 64
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || exit 64
          [[ "$OPERATION_ID" =~ ^preview-[0-9a-f]{32}$ ]] || exit 64
          permission=$(gh api "repos/$PREVIEW_REPOSITORY/collaborators/$GITHUB_ACTOR/permission" --jq .permission)
          case "$permission" in admin|maintain|write) ;; *) exit 77;; esac
      - name: Load Preview-only controller credentials
        id: preview-secrets
        uses: 1password/load-secrets-action@3a12b0ab99d9cd590a3e9b5a90ea017210ed9556 # v4
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          SSH_PRIVATE_KEY: op://projects/Project Space Preview Deploy SSH/private_key
          TS_OAUTH_CLIENT_ID: op://projects/Project Space Preview Tailscale CI Client ID/credential
          TS_OAUTH_SECRET: op://projects/Project Space Preview Tailscale CI Secret/credential
      - name: Configure forced-command Preview SSH identity
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ steps.preview-secrets.outputs.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/project-space-preview"
          printf '%s\n' '${{ vars.PROJECT_SPACE_PREVIEW_SSH_KNOWN_HOSTS }}' > "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<SSH_CONFIG
          Host project-space-preview
            HostName ${{ vars.PROJECT_SPACE_PREVIEW_DEPLOY_IP }}
            User preview-deploy
            IdentityFile ~/.ssh/project-space-preview
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            ForwardAgent no
            ForwardX11 no
            BatchMode yes
            PasswordAuthentication no
            KbdInteractiveAuthentication no
          SSH_CONFIG
          chmod 600 "$HOME/.ssh/config" "$HOME/.ssh/known_hosts" "$HOME/.ssh/project-space-preview"
      - name: Connect ephemeral Preview CI identity to Tailscale
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          oauth-client-id: ${{ steps.preview-secrets.outputs.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ steps.preview-secrets.outputs.TS_OAUTH_SECRET }}
          tags: tag:ci-project-space-preview
          ping: ${{ vars.PROJECT_SPACE_PREVIEW_DEPLOY_IP }}
      - name: Remove only the requested PR resources and persist tombstone
        shell: bash
        env:
          PR_NUMBER: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          jq -n --arg repository "$PREVIEW_REPOSITORY" --argjson pr "$PR_NUMBER" \
            --arg reason "manual_destroy" '{repository:$repository,prNumber:$pr,reason:$reason}' |
            ssh project-space-preview destroy > cleanup-result.json
          jq -e '.state == "removed" and .cleanup.containersAbsent and .cleanup.networksAbsent and
            .cleanup.volumesAbsent and .cleanup.runtimePathAbsent and .cleanup.routeAbsent' cleanup-result.json >/dev/null
      - name: Mark latest GitHub Preview deployment inactive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          deployment_id=$(gh api "repos/$PREVIEW_REPOSITORY/deployments?environment=preview/pr-$PR_NUMBER&per_page=1" --jq '.[0].id // empty')
          [[ -z "$deployment_id" ]] || gh api --method POST \
            "repos/$PREVIEW_REPOSITORY/deployments/$deployment_id/statuses" --input - <<JSON
          {"state":"inactive","environment":"preview/pr-$PR_NUMBER","auto_inactive":false,
           "log_url":"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID",
           "description":"Manual destroy positively removed Preview resources."}
          JSON
