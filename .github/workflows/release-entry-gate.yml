name: Trusted release entry gate

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-entry-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: Trusted release entry
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out trusted main validator
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Fetch the exact pull request revision as data
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          [[ "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          target_ref="refs/remotes/origin/release-gate/${PR_NUMBER}"
          git fetch --no-tags origin \
            "pull/${PR_NUMBER}/head:${target_ref}"
          [[ "$(git rev-parse "$target_ref")" == "$PR_HEAD_SHA" ]]

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install trusted validator dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Enforce one exact versioned release entry
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RELEASE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bun scripts/validate-release-pr.ts
