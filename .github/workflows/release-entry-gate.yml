name: Trusted release decision

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-decision-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Release decision
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve one current ready pull request
        id: target
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr_number=$EVENT_PR
          requested_head=$EVENT_HEAD_SHA
          [[ "$pr_number" =~ ^[1-9][0-9]*$ ]]
          [[ "$requested_head" =~ ^[0-9a-f]{40}$ ]]

          pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}")
          current_head=$(jq -er '.head.sha' <<<"$pr")
          current_main=$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)
          state=$(jq -er '.state' <<<"$pr")
          draft=$(jq -r '.draft' <<<"$pr")
          base=$(jq -er '.base.ref' <<<"$pr")
          [[ "$current_main" =~ ^[0-9a-f]{40}$ ]]

          if [[ "$state" != open ]] || [[ "$draft" == true ]] ||
            [[ "$base" != main ]] || [[ "$current_head" != "$requested_head" ]]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            printf 'Skipped stale or no-longer-ready PR #%s event for `%s`; current head is `%s`.\n' \
              "$pr_number" "$requested_head" "$current_head" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "pr=$pr_number" >> "$GITHUB_OUTPUT"
          echo "head_sha=$current_head" >> "$GITHUB_OUTPUT"
          echo "main_sha=$current_main" >> "$GITHUB_OUTPUT"

      - name: Check out trusted latest main validator
        if: steps.target.outputs.skip != 'true'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.target.outputs.main_sha }}

      - name: Fetch exact pull request revision as data
        if: steps.target.outputs.skip != 'true'
        env:
          PR_HEAD_SHA: ${{ steps.target.outputs.head_sha }}
          PR_NUMBER: ${{ steps.target.outputs.pr }}
        run: |
          set -euo pipefail
          target_ref="refs/remotes/origin/release-gate/${PR_NUMBER}"
          git fetch --no-tags origin \
            "pull/${PR_NUMBER}/head:${target_ref}"
          [[ "$(git rev-parse "$target_ref")" == "$PR_HEAD_SHA" ]]

      - name: Set up Bun
        if: steps.target.outputs.skip != 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install trusted validator dependencies
        if: steps.target.outputs.skip != 'true'
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Decide ordinary or versioned release mode
        if: steps.target.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.target.outputs.pr }}
          RELEASE_BASE_SHA: ${{ steps.target.outputs.main_sha }}
          RELEASE_HEAD_SHA: ${{ steps.target.outputs.head_sha }}
        run: bun scripts/validate-release-pr.ts

      - name: Revalidate exact pull request head and main
        if: steps.target.outputs.skip != 'true'
        env:
          EXPECTED_HEAD_SHA: ${{ steps.target.outputs.head_sha }}
          EXPECTED_MAIN_SHA: ${{ steps.target.outputs.main_sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.target.outputs.pr }}
        run: |
          set -euo pipefail
          pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
          current_main=$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)
          [[ "$(jq -er '.state' <<<"$pr")" == open ]]
          [[ "$(jq -r '.draft' <<<"$pr")" == false ]]
          [[ "$(jq -er '.base.ref' <<<"$pr")" == main ]]
          [[ "$(jq -er '.head.sha' <<<"$pr")" == "$EXPECTED_HEAD_SHA" ]]
          [[ "$current_main" == "$EXPECTED_MAIN_SHA" ]]
