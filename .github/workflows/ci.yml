name: CI
run-name: 'CI · PR #${{ github.event.pull_request.number || inputs.pr || ''manual'' }}'

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      pr:
        description: Open same-repository pull request number to repair
        required: true
        type: string
      requested_head_sha:
        description: Exact current pull request head SHA
        required: true
        type: string
      base_sha:
        description: Exact current pull request base SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fast-ci-${{ github.event.pull_request.number || inputs.pr || github.ref }}
  cancel-in-progress: true

jobs:
  fast-ci:
    name: Fast CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      go: ${{ steps.select.outputs.go }}

    steps:
      - name: Fence an exact manual repair request
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr }}
          REQUESTED_BASE_SHA: ${{ inputs.base_sha }}
          REQUESTED_HEAD_SHA: ${{ inputs.requested_head_sha }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$REQUESTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REQUESTED_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_SHA" == "$REQUESTED_HEAD_SHA" ]] || {
            echo "Select the pull request head branch when dispatching Fast CI." >&2
            exit 64
          }
          pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
          jq -e \
            --arg base "$REQUESTED_BASE_SHA" \
            --arg head "$REQUESTED_HEAD_SHA" \
            --arg repository "$GITHUB_REPOSITORY" \
            '.state == "open" and .head.repo.full_name == $repository and
             .head.sha == $head and .base.sha == $base' \
            <<<"$pr" >/dev/null

      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || inputs.requested_head_sha || github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Select changed-path extras
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
          EVENT_NAME: pull_request
          HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.requested_head_sha }}
        run: |
          set -euo pipefail
          policy=$(bun scripts/release-verification-policy.ts \
            --event "$EVENT_NAME" --base "$BASE_SHA" --head "$HEAD_SHA")
          for lane in cliDocs docs go mobile rust workflow; do
            value=$(jq -er --arg lane "$lane" '.fastCi[$lane] | tostring' <<<"$policy")
            echo "${lane}=${value}" >> "$GITHUB_OUTPUT"
          done
          jq -r '"Selection: " + (.fastCi | to_entries | map(select(.value) | .key) | join(", "))' \
            <<<"$policy" >> "$GITHUB_STEP_SUMMARY"

      - name: Restore exact Bun package downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-1.3.14-${{ hashFiles('bun.lock') }}

      - name: Install root dependencies once
        run: bun run ci:check -- locked-root-dependencies

      - name: Check package-manager policy
        run: bun run ci:check -- package-manager-policy

      - name: Validate documentation and change specifications
        env:
          DOCS_SPECS_BASE: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
        run: bun run ci:check -- docs-specs

      - name: Run TypeScript tests
        run: bun run ci:check -- tests

      - name: Build web surfaces
        run: bun run ci:check -- web-build

      - name: Set up Go for selected extras
        if: steps.select.outputs.go == 'true' || steps.select.outputs.cliDocs == 'true' || steps.select.outputs.workflow == 'true'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify generated CLI documentation
        if: steps.select.outputs.cliDocs == 'true'
        run: bun run ci:check -- cli-docs-contract generated-cli-docs

      - name: Type-check and build documentation
        if: steps.select.outputs.docs == 'true'
        run: bun run ci:check -- docs-dependencies docs-typecheck docs-build

      - name: Build mobile prototype
        if: steps.select.outputs.mobile == 'true'
        run: bun run ci:check -- mobile-dependencies mobile-build

      - name: Test and vet Go
        if: steps.select.outputs.go == 'true'
        run: bun run ci:check -- go-race go-vet

      - name: Install pinned Rust toolchain for hostd
        if: steps.select.outputs.rust == 'true'
        run: rustup toolchain install 1.90.0 --profile minimal --component clippy,rustfmt

      - name: Test and lint project-hostd
        if: steps.select.outputs.rust == 'true'
        run: bun run ci:check -- rust-format rust-clippy rust-tests

      - name: Lint workflows and shell scripts
        if: steps.select.outputs.workflow == 'true'
        run: bun run ci:check -- actionlint shell-syntax

  windows-cli:
    name: Windows CLI compatibility
    needs: fast-ci
    if: needs.fast-ci.outputs.go == 'true'
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.requested_head_sha || github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test, vet, and build the native Windows CLI
        shell: powershell
        run: |
          go test ./cmd/project -run '^TestWindows' -count=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./internal/machineconnect ./internal/selfupdate -run '^$'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./cmd/project ./internal/machineconnect ./internal/selfupdate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -trimpath -o project.exe ./cmd/project
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  preview-artifacts:
    name: Build exact-head Preview artifacts
    needs: fast-ci
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image archives with the exact PR recipes
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/preview-artifact
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SOURCE_CONTEXT: ${{ github.workspace }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR/images"
          for target in docs web prototype; do
            docker buildx bake \
              --allow "fs.write=$ARTIFACT_DIR/images" \
              --file deploy/preview-artifact-bake.hcl \
              "$target"
          done

      - name: Create canonical exact-head manifest
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/preview-artifact
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          python3 scripts/preview-artifact-contract.py create \
            --root "$GITHUB_WORKSPACE" \
            --output "$ARTIFACT_DIR/manifest.json" \
            --repository "$GITHUB_REPOSITORY" \
            --repository-id "$GITHUB_REPOSITORY_ID" \
            --pr "$PR_NUMBER" \
            --head-sha "$PR_HEAD_SHA" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Attest manifest and image archives
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            ${{ runner.temp }}/preview-artifact/manifest.json
            ${{ runner.temp }}/preview-artifact/images/web.tar
            ${{ runner.temp }}/preview-artifact/images/docs.tar
            ${{ runner.temp }}/preview-artifact/images/prototype.tar

      - name: Upload immutable Preview artifact
        id: artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-images-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/preview-artifact
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Record immutable artifact identity
        env:
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          if [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
            ARTIFACT_DIGEST="sha256:$ARTIFACT_DIGEST"
          fi
          [[ "$ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'Artifact ID: `%s`\n\nArtifact digest: `%s`\n' \
            "$ARTIFACT_ID" "$ARTIFACT_DIGEST" >> "$GITHUB_STEP_SUMMARY"
