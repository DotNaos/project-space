name: Pull request CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast-ci:
    name: Fast CI
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Select changed-path extras
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          policy=$(bun scripts/release-verification-policy.ts \
            --event "$EVENT_NAME" --base "$BASE_SHA" --head "$HEAD_SHA")
          for lane in cliDocs docs go mobile workflow; do
            value=$(jq -er --arg lane "$lane" '.fastCi[$lane] | tostring' <<<"$policy")
            echo "${lane}=${value}" >> "$GITHUB_OUTPUT"
          done
          jq -r '"Selection: " + (.fastCi | to_entries | map(select(.value) | .key) | join(", "))' \
            <<<"$policy" >> "$GITHUB_STEP_SUMMARY"

      - name: Restore exact Bun package downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-1.3.14-${{ hashFiles('bun.lock') }}

      - name: Install root dependencies once
        run: bun install --frozen-lockfile

      - name: Check package policy, test, and build web surfaces
        run: |
          bun run check:package-manager
          bun test --isolate
          bun run build:web

      - name: Set up Go for selected extras
        if: steps.select.outputs.go == 'true' || steps.select.outputs.cliDocs == 'true' || steps.select.outputs.workflow == 'true'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify generated CLI documentation
        if: steps.select.outputs.cliDocs == 'true'
        run: |
          go test ./cmd/project -run 'CLIDocs|RootCommandIncludesExpectedCommands'
          bun run docs:cli:check

      - name: Type-check and build documentation
        if: steps.select.outputs.docs == 'true'
        working-directory: apps/docs
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run build

      - name: Build mobile prototype
        if: steps.select.outputs.mobile == 'true'
        working-directory: apps/mobile
        run: |
          bun install --frozen-lockfile
          bun run build:prototype

      - name: Test and vet Go
        if: steps.select.outputs.go == 'true'
        run: |
          go test -race ./...
          go vet ./...

      - name: Lint workflows and shell scripts
        if: steps.select.outputs.workflow == 'true'
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          git ls-files -z '*.sh' | xargs -0 bash -n
