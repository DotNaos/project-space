name: Start exact production delivery

on:
  workflow_call:
    inputs:
      source-sha:
        required: true
        type: string

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: Dispatch exact published revision
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Start existing production workflow
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ inputs.source-sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          gh workflow run deploy-production.yml \
            --ref main \
            -f commit="$RELEASE_COMMIT"
