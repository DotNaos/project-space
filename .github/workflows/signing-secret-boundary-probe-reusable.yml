name: Signing secret boundary probe reusable

on:
  workflow_call:
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN:
        description: Optional named forwarding probe for the protected environment secret.
        required: false

permissions: {}

jobs:
  probe:
    name: Require protected environment secret
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    environment: release-signing

    steps:
      - name: Require a non-empty service-account token
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          if [[ -z ${OP_SERVICE_ACCOUNT_TOKEN:-} ]]; then
            /usr/bin/printf 'Protected environment secret is unavailable.\n' >&2
            exit 1
          fi
          /usr/bin/printf 'Protected environment secret is available.\n'
