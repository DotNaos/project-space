name: Parallel release quality

on:
  workflow_call:
    inputs:
      source-sha:
        description: Exact source commit to test and build.
        required: true
        type: string

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript tests and web build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.source-sha }}
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Restore exact Bun package downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-1.3.14-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bun run ci:check -- locked-root-dependencies
      - name: Test TypeScript and build web surfaces
        run: bun run ci:check -- ui-copy typecheck tests web-build

  mobile:
    name: Mobile Expo build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Restore exact mobile Bun package downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-mobile-${{ runner.os }}-${{ runner.arch }}-1.3.14-${{ hashFiles('apps/mobile/bun.lock') }}
      - name: Install frozen mobile dependencies
        run: bun run ci:check -- mobile-dependencies
      - name: Build Expo web prototype
        run: bun run ci:check -- mobile-build

  go:
    name: Go race tests and vet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Test and vet Go
        run: bun run ci:check -- go-race go-vet

  rust:
    name: Rust hostd tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component clippy,rustfmt
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Test and lint project-hostd
        run: bun run ci:check -- rust-format rust-clippy rust-tests
