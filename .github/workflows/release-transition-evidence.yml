name: Delivery transition evidence

on:
  workflow_run:
    workflows: [Release, Deploy PR preview, Deploy production]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  evidence:
    name: Publish failed delivery evidence
    if: github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Build sanitized machine-readable evidence
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
          SOURCE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_URL: ${{ github.event.workflow_run.html_url }}
          SOURCE_WORKFLOW: ${{ github.event.workflow_run.name }}
        run: |
          set -euo pipefail
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/jobs?per_page=100" \
            --slurp > "$RUNNER_TEMP/jobs-pages.json"
          logs_available=false
          if gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/logs" \
            > "$RUNNER_TEMP/delivery-logs.zip" 2>/dev/null; then
            logs_available=true
          fi
          failure_class=infrastructure_failure
          if [[ "$SOURCE_CONCLUSION" == cancelled ]]; then
            failure_class=expected_deferred
          elif [[ "$logs_available" == true ]] &&
            unzip -p "$RUNNER_TEMP/delivery-logs.zip" 2>/dev/null |
              grep -Eqi \
                'Requested commit must be a full lowercase Git SHA|Production delivery must be dispatched from trusted main|does not match package.json version|not an ancestor of the requested app commit'; then
            failure_class=invalid_change
          elif [[ "$logs_available" == true ]] &&
            unzip -p "$RUNNER_TEMP/delivery-logs.zip" 2>/dev/null |
              grep -Eq \
                'TestWSLConnectorQuiescenceWaitsForLinuxProcesses|durable Codex operation snapshots|connector runtime stop signed contract'; then
            failure_class=flaky_test_signature
          elif jq -e '
            [.[].jobs[]? |
              select(.conclusion == "failure") |
              .name] |
            any(test("Cross-platform quality gates|Windows x64 machine tools|Linux x64 machine tools|macOS arm64 machine tools|Build immutable Preview images"))
          ' "$RUNNER_TEMP/jobs-pages.json" >/dev/null; then
            failure_class=application_regression
          fi
          case "$SOURCE_WORKFLOW" in
            Release) transition=release ;;
            'Deploy PR preview') transition=preview ;;
            'Deploy production') transition=production ;;
            *) transition=delivery ;;
          esac
          if [[ "$SOURCE_CONCLUSION" == cancelled ]]; then
            error_code="${transition}_superseded"
          else
            error_code="${transition}_transition_failed"
          fi
          jq -n \
            --arg conclusion "$SOURCE_CONCLUSION" \
            --arg errorCode "$error_code" \
            --arg event "$SOURCE_EVENT" \
            --arg failureClass "$failure_class" \
            --arg headSha "$SOURCE_HEAD_SHA" \
            --argjson runId "$SOURCE_RUN_ID" \
            --arg runUrl "$SOURCE_RUN_URL" \
            --arg workflow "$SOURCE_WORKFLOW" \
            --slurpfile pages "$RUNNER_TEMP/jobs-pages.json" \
            '{errorCode:$errorCode,
              conclusion:$conclusion,event:$event,failureClass:$failureClass,headSha:$headSha,
              runId:$runId,runUrl:$runUrl,
              workflow:$workflow,
              failedJobs:[$pages[][]?.jobs[] |
                select(.conclusion == "failure" or .conclusion == "cancelled") |
                {name,conclusion,startedAt:.started_at,completedAt:.completed_at,htmlUrl:.html_url}]}' \
            > delivery-transition.json
          jq -r '
            "Transition code: `\(.errorCode)`\n\n" +
            "Source run: [\(.runId)](\(.runUrl))\n\n" +
            (if (.failedJobs | length) == 0 then
              "No failed job was published; the source run ended as `\(.conclusion)`."
             else
              "Failed jobs:\n" +
              ([.failedJobs[] | "- `\(.name)`: `\(.conclusion)`"] | join("\n"))
             end)
          ' delivery-transition.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload delivery transition evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: delivery-transition-${{ github.event.workflow_run.id }}
          path: delivery-transition.json
          if-no-files-found: error
          retention-days: 14
