name: Release trust roots

on:
  workflow_call:
    inputs:
      source-sha:
        required: true
        type: string
      version:
        required: true
        type: string
    outputs:
      artifact-digest:
        value: ${{ jobs.derive.outputs.artifact-digest }}
      artifact-id:
        value: ${{ jobs.derive.outputs.artifact-id }}
      artifact-name:
        value: ${{ jobs.derive.outputs.artifact-name }}

permissions:
  contents: read

jobs:
  derive:
    name: Derive isolated connector trust roots
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-name: ${{ steps.metadata.outputs.artifact-name }}

    steps:
      - name: Validate release context
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          BASH_ENV: /dev/null
          EXPECTED_SHA: ${{ inputs.source-sha }}
          EXPECTED_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          PATH: /usr/bin:/bin
        run: |
          [[ $EXPECTED_SHA =~ ^[0-9a-f]{40}$ ]]
          [[ $EXPECTED_VERSION =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          api_root="https://api.github.com/repos/${GITHUB_REPOSITORY}/commits"
          tag="v${EXPECTED_VERSION}"
          /usr/bin/curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api_root/$tag" > "$RUNNER_TEMP/tag-commit.json"
          /usr/bin/curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/compare/${EXPECTED_SHA}...main" \
            > "$RUNNER_TEMP/main-ancestry.json"
          /usr/bin/python3 -I - "$RUNNER_TEMP/tag-commit.json" \
            "$RUNNER_TEMP/main-ancestry.json" "$EXPECTED_SHA" <<'PY'
          import json, pathlib, sys
          tag = json.loads(pathlib.Path(sys.argv[1]).read_text())
          ancestry = json.loads(pathlib.Path(sys.argv[2]).read_text())
          expected = sys.argv[3]
          if tag.get("sha") != expected:
              raise SystemExit("Release tag must point at the exact queued merge.")
          if ancestry.get("status") not in {"ahead", "identical"} or (ancestry.get("merge_base_commit") or {}).get("sha") != expected:
              raise SystemExit("Queued release commit must be reachable from current main.")
          PY

      - name: Resolve trust-root artifact name
        id: metadata
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          BASH_ENV: /dev/null
          EXPECTED_SHA: ${{ inputs.source-sha }}
          PATH: /usr/bin:/bin
        run: |
          echo "artifact-name=connector-runtime-trust-roots-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${EXPECTED_SHA}" >> "$GITHUB_OUTPUT"

      - name: Materialize pinned public trust roots
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          BASH_ENV: /dev/null
          PATH: /usr/bin:/bin
        run: |
          public_root="$RUNNER_TEMP/connector-runtime-trust-roots"
          umask 077
          /bin/rm -rf "$public_root"
          /bin/mkdir -p "$public_root"
          /bin/cat > "$public_root/release-manifest-signing-public-key.pem" <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MCowBQYDK2VwAyEABuZYqkn+3DcolGfvYxy3Fc8cn/XPDzL3t0J5jWE2Jug=
          -----END PUBLIC KEY-----
          PEM
          /bin/chmod 0644 "$public_root"/*.pem

      - name: Validate public trust roots
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          BASH_ENV: /dev/null
          PATH: /usr/bin:/bin
        run: |
          root="$RUNNER_TEMP/connector-runtime-trust-roots"
          expected='release-manifest-signing-public-key.pem'
          actual=$(/usr/bin/find "$root" -mindepth 1 -maxdepth 1 -type f -print | /usr/bin/sed "s#^$root/##" | LC_ALL=C /usr/bin/sort)
          [[ $actual == "$expected" ]]
          [[ -z $(/usr/bin/find "$root" -mindepth 1 \( -type l -o ! -type f \) -print -quit) ]]
          /usr/bin/openssl pkey -pubin -in "$root/release-manifest-signing-public-key.pem" -noout
          release_digest=$(/usr/bin/sha256sum "$root/release-manifest-signing-public-key.pem" | /usr/bin/cut -d ' ' -f 1)
          [[ $release_digest == aff71d44e194f87e7e958296306059d3d5b55d7c369963b61d57627e03f4a451 ]]

      - name: Upload public trust roots
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.metadata.outputs.artifact-name }}
          if-no-files-found: error
          overwrite: false
          path: ${{ runner.temp }}/connector-runtime-trust-roots/*.pem
          retention-days: 7
