name: Isolated Linux release

on:
  workflow_call:
    inputs:
      source-sha:
        description: Exact source commit to build and bind into the artifact.
        required: true
        type: string
      version:
        description: Semantic release version without the v prefix.
        required: true
        type: string
      trust-artifact-id:
        description: Immutable Actions artifact ID containing the public trust roots.
        required: true
        type: string
      trust-artifact-digest:
        description: GitHub-recorded SHA-256 digest for the trust-root artifact.
        required: true
        type: string
      trust-artifact-name:
        description: Exact trust-root artifact name.
        required: true
        type: string
    outputs:
      artifact-digest:
        description: GitHub-recorded SHA-256 digest of the Linux release artifact.
        value: ${{ jobs.build.outputs.artifact-digest }}
      artifact-id:
        description: Immutable ID of the Linux release artifact.
        value: ${{ jobs.build.outputs.artifact-id }}
      artifact-name:
        description: Deterministic Linux release artifact name.
        value: ${{ jobs.build.outputs.artifact-name }}
      version:
        description: Validated release version.
        value: ${{ jobs.build.outputs.version }}

permissions:
  contents: read

jobs:
  build:
    name: Build Linux x64 machine tools
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-name: ${{ steps.contract.outputs.artifact-name }}
      version: ${{ steps.contract.outputs.version }}
    steps:
      - name: Validate exact release contract
        id: contract
        shell: bash
        env:
          RELEASE_SOURCE_SHA: ${{ inputs.source-sha }}
          RELEASE_VERSION: ${{ inputs.version }}
          TRUST_ARTIFACT_DIGEST: ${{ inputs.trust-artifact-digest }}
          TRUST_ARTIFACT_ID: ${{ inputs.trust-artifact-id }}
          TRUST_ARTIFACT_NAME: ${{ inputs.trust-artifact-name }}
        run: |
          set -euo pipefail
          [[ $RELEASE_SOURCE_SHA =~ ^[0-9a-f]{40}$ ]]
          [[ $RELEASE_VERSION =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ $TRUST_ARTIFACT_ID =~ ^[1-9][0-9]*$ ]]
          [[ $TRUST_ARTIFACT_DIGEST =~ ^[0-9a-f]{64}$ ]]
          expected_trust_name="project-space-release-trust-roots-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RELEASE_SOURCE_SHA}"
          [[ $TRUST_ARTIFACT_NAME == "$expected_trust_name" ]]
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "artifact-name=project-space-machine-tools-linux-x64-v${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check out exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.source-sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify checked-out source
        env:
          RELEASE_SOURCE_SHA: ${{ inputs.source-sha }}
        run: |
          set -euo pipefail
          [[ $(git rev-parse HEAD) == "$RELEASE_SOURCE_SHA" ]]

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Restore exact Bun package downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-1.3.14-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Linux packaging checks
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          bash -n packaging/linux/*.sh
          packaging/linux/test-release-packaging.sh "$VERSION"

      - name: Build native Linux binaries
        env:
          PROJECT_RELEASE_SOURCE_SHA: ${{ inputs.source-sha }}
          RELEASE_SOURCE_SHA: ${{ inputs.source-sha }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist/linux
          bun packaging/release/build-codex-host.ts \
            bun-linux-x64 \
            dist/linux/project-codex-host
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -trimpath \
            -ldflags "-s -w -X main.projectMachineClientVersion=$VERSION -X main.projectMachineClientReleaseID=v$VERSION -X main.projectMachineClientBuildID=$RELEASE_SOURCE_SHA -X main.projectSpaceMachineBackendURL=https://projects.os-home.net" \
            -o dist/linux/project \
            ./cmd/project

      - name: Download exact release trust roots
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ inputs.trust-artifact-id }}
          merge-multiple: true
          path: dist/linux

      - name: Prepare pinned managed Codex runtime
        run: packaging/linux/prepare-codex-runtime.sh "$(pwd -P)/dist/linux"

      - name: Smoke-test pinned Codex App Server
        run: bun packaging/linux/smoke-codex-runtime.ts "$(pwd -P)/dist/linux/codex"

      - name: Build and hash deterministic bundle
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH=0 packaging/linux/build-machine-tools.sh \
            "$VERSION" \
            dist/linux \
            dist/linux-release

      - name: Upload release artifacts
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.contract.outputs.artifact-name }}
          if-no-files-found: error
          overwrite: false
          path: |
            dist/linux-release/project-space-machine-tools-linux-x64-v${{ steps.contract.outputs.version }}.tar.gz
            dist/linux-release/project-space-machine-tools-linux-x64-v${{ steps.contract.outputs.version }}.tar.gz.sha256
