name: Release

on:
  pull_request:
    paths:
      - '.github/workflows/release*.yml'
      - 'cmd/project/**'
      - 'go.mod'
      - 'go.sum'
      - 'internal/machineconnect/**'
      - 'internal/projectrun/**'
      - 'package.json'
      - 'bun.lock'
      - 'packaging/linux/**'
      - 'packaging/macos/**'
      - 'packaging/release/**'
      - 'packaging/windows/**'
      - 'server/**'
      - 'tests/**'
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Cross-platform quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.release-metadata.outputs.version }}

    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Resolve release metadata
        id: release-metadata
        shell: bash
        env:
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          package_version=$(awk -F '"' '/"version"/ { print $4; exit }' package.json)
          if [[ ! $package_version =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "package.json contains an invalid release version: $package_version" >&2
            exit 64
          fi
          if [[ $RELEASE_REF_TYPE == tag && $RELEASE_REF_NAME != "v${package_version}" ]]; then
            echo "Tag $RELEASE_REF_NAME does not match package.json version $package_version." >&2
            exit 65
          fi
          echo "version=$package_version" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test and build TypeScript
        run: |
          bun run check
          bun test
          bun run build

      - name: Test and vet Go
        run: |
          go test -race ./...
          go vet ./...

  trust-roots:
    name: Derive connector trust roots
    needs: quality
    uses: ./.github/workflows/release-trust-roots.yml
    with:
      source-sha: ${{ github.sha }}
      version: ${{ needs.quality.outputs.version }}

  windows-x64:
    name: Windows x64 machine tools
    needs: quality
    runs-on: windows-2025
    timeout-minutes: 45
    outputs:
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-name: ${{ steps.version.outputs.artifact-name }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Resolve and verify release version
        id: version
        shell: powershell
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($packageVersion -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw "package.json contains an invalid release version: $packageVersion"
          }
          if ($packageVersion -ne '${{ needs.quality.outputs.version }}') {
            throw "Windows release version $packageVersion does not match the proven version."
          }
          if ('${{ github.ref_type }}' -eq 'tag') {
            $tag = '${{ github.ref_name }}'
            if ($tag -ne "v$packageVersion") {
              throw "Tag $tag does not match package.json version $packageVersion."
            }
          }
          "VERSION=$packageVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "version=$packageVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "artifact-name=project-space-machine-tools-windows-x64-v$packageVersion" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Windows release checks
        shell: powershell
        run: |
          bun run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun test tests/windows-release-version.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./cmd/project -run 'Windows|ConnectorMachineService|AuthenticatedConnector|ConnectorInstallerResolution|ConnectorBinaryName|UsableConnectorBinary|ConnectorRun|ConnectorCommandRegistersAuthenticatedRun|RootCommandPrintsBuildVersion'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./internal/machineconnect
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./cmd/project ./internal/machineconnect
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\packaging\windows\test-release-packaging.ps1

      - name: Build native Windows binaries
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path dist\windows -Force | Out-Null
          bun run build:connector:windows-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:CGO_ENABLED = '0'
          $ldflags = "-s -w -X main.projectMachineClientVersion=$env:VERSION -X main.projectMachineClientReleaseID=v$env:VERSION -X main.projectMachineClientBuildID=$env:GITHUB_SHA -X main.projectSpaceMachineBackendURL=https://projects.os-home.net"
          go build -trimpath -ldflags $ldflags -o dist\windows\project.exe .\cmd\project
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install verified Inno Setup compiler
        shell: powershell
        run: |
          $compiler = & .\packaging\windows\install-inno-setup.ps1 `
            -DestinationDirectory "$env:RUNNER_TEMP\inno-setup-6.7.3"
          "INNO_COMPILER=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build the per-user installer
        shell: powershell
        run: |
          & .\packaging\windows\build-installer.ps1 `
            -Version $env:VERSION `
            -SourceDirectory dist\windows `
            -CompilerPath $env:INNO_COMPILER

      - name: Hash installer and render WinGet manifests
        id: package
        shell: powershell
        run: |
          $installerName = 'project-space-machine-tools-windows-x64-setup.exe'
          $installerPath = Join-Path (Resolve-Path dist\windows).Path $installerName
          if (-not (Test-Path -LiteralPath $installerPath)) {
            throw "Installer was not created: $installerPath"
          }
          $sha256 = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA256).Hash
          $checksumLine = $sha256.ToLowerInvariant() + '  ' + $installerName + "`n"
          $utf8WithoutBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText(
            (Join-Path (Resolve-Path dist\windows).Path 'SHA256SUMS.txt'),
            $checksumLine,
            $utf8WithoutBom
          )
          $installerUrl = "https://github.com/${{ github.repository }}/releases/download/v$env:VERSION/$installerName"
          $manifestDirectory = & .\packaging\windows\render-winget-manifests.ps1 `
            -Version $env:VERSION `
            -InstallerUrl $installerUrl `
            -InstallerSha256 $sha256 `
            -OutputDirectory dist\winget
          "manifest-directory=$manifestDirectory" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Validate WinGet manifests
        shell: powershell
        run: |
          winget --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The hosted image can lag behind the schema required by winget-pkgs.
          # Suppress only validation warnings; manifest errors still return non-zero.
          winget validate --ignore-warnings '${{ steps.package.outputs.manifest-directory }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload release artifacts
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.version.outputs.artifact-name }}
          if-no-files-found: error
          overwrite: false
          path: |
            dist/windows/project-space-machine-tools-windows-x64-setup.exe
            dist/windows/SHA256SUMS.txt
            dist/winget/manifests/d/DotNaos/Project/${{ steps.version.outputs.version }}/*.yaml

  linux-x64:
    name: Linux x64 machine tools
    needs: [quality, trust-roots]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-name: ${{ steps.version.outputs.artifact-name }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Resolve and verify release version
        id: version
        shell: bash
        env:
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          package_version=$(bun -e "console.log(require('./package.json').version)")
          if [[ ! $package_version =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "package.json contains an invalid release version: $package_version" >&2
            exit 1
          fi
          if [[ $package_version != '${{ needs.quality.outputs.version }}' ]]; then
            echo "Linux release version $package_version does not match the proven version." >&2
            exit 1
          fi
          if [[ $RELEASE_REF_TYPE == tag && $RELEASE_REF_NAME != "v${package_version}" ]]; then
            echo "Tag $RELEASE_REF_NAME does not match package.json version $package_version." >&2
            exit 1
          fi
          echo "VERSION=$package_version" >> "$GITHUB_ENV"
          echo "version=$package_version" >> "$GITHUB_OUTPUT"
          echo "artifact-name=project-space-machine-tools-linux-x64-v$package_version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Linux release checks
        run: |
          bash -n packaging/linux/*.sh
          packaging/linux/test-release-packaging.sh "$VERSION"
          go test ./cmd/project -run 'ConnectorMachineService|AuthenticatedConnector|ConnectorBinaryName|UsableConnectorBinary|ConnectorRun|ConnectorCommandRegistersAuthenticatedRun|RootCommandPrintsBuildVersion'
          go test ./internal/machineconnect
          go vet ./cmd/project ./internal/machineconnect

      - name: Build native Linux binaries
        run: |
          mkdir -p dist/linux
          bun packaging/release/build-connector.ts \
            bun-linux-x64 \
            dist/linux/project-space-connector
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -trimpath \
            -ldflags "-s -w -X main.projectMachineClientVersion=$VERSION -X main.projectMachineClientReleaseID=v$VERSION -X main.projectMachineClientBuildID=$GITHUB_SHA -X main.projectSpaceMachineBackendURL=https://projects.os-home.net" \
            -o dist/linux/project \
            ./cmd/project

      - name: Download release trust roots
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.trust-roots.outputs.artifact-id }}
          merge-multiple: true
          path: dist/linux

      - name: Build and hash deterministic bundle
        run: |
          SOURCE_DATE_EPOCH=0 packaging/linux/build-machine-tools.sh \
            "$VERSION" \
            dist/linux \
            dist/linux-release

      - name: Upload release artifacts
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.version.outputs.artifact-name }}
          if-no-files-found: error
          overwrite: false
          path: |
            dist/linux-release/project-space-machine-tools-linux-x64-v${{ steps.version.outputs.version }}.tar.gz
            dist/linux-release/project-space-machine-tools-linux-x64-v${{ steps.version.outputs.version }}.tar.gz.sha256

  macos-arm64:
    name: macOS arm64 machine tools
    needs: [quality, trust-roots]
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/release-macos.yml
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
    with:
      source-sha: ${{ github.sha }}
      trust-artifact-digest: ${{ needs.trust-roots.outputs.artifact-digest }}
      trust-artifact-id: ${{ needs.trust-roots.outputs.artifact-id }}
      trust-artifact-name: ${{ needs.trust-roots.outputs.artifact-name }}
      version: ${{ needs.quality.outputs.version }}

  manifest-prepare:
    name: Prepare exact release manifest payload
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [quality, trust-roots, windows-x64, linux-x64, macos-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-name: ${{ steps.metadata.outputs.artifact-name }}
      version: ${{ needs.quality.outputs.version }}

    steps:
      - name: Check out exact source without credentials
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate platform handoff metadata
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.quality.outputs.version }}
          LINUX_VERSION: ${{ needs.linux-x64.outputs.version }}
          MACOS_VERSION: ${{ needs.macos-arm64.outputs.version }}
          WINDOWS_VERSION: ${{ needs.windows-x64.outputs.version }}
        run: |
          set -euo pipefail
          [[ $GITHUB_REF_NAME == "v${EXPECTED_VERSION}" ]]
          [[ $GITHUB_SHA =~ ^[0-9a-f]{40}$ ]]
          [[ $LINUX_VERSION == "$EXPECTED_VERSION" ]]
          [[ $MACOS_VERSION == "$EXPECTED_VERSION" ]]
          [[ $WINDOWS_VERSION == "$EXPECTED_VERSION" ]]

      - name: Download exact Windows handoff
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.windows-x64.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/release-windows

      - name: Download exact Linux handoff
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.linux-x64.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/release-linux

      - name: Download exact macOS handoff
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.macos-arm64.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/release-macos

      - name: Download exact public trust roots
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.trust-roots.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/release-trust-roots

      - name: Normalize and authenticate release inputs
        env:
          VERSION: ${{ needs.quality.outputs.version }}
        run: |
          set -euo pipefail
          bash packaging/release/normalize-platform-artifacts.sh \
            "$VERSION" \
            "$RUNNER_TEMP/release-windows" \
            "$RUNNER_TEMP/release-linux" \
            "$RUNNER_TEMP/release-macos" \
            "$RUNNER_TEMP/release-assets"
          cmp packaging/release/trust-roots/connector-command-signing-public-key.pem \
            "$RUNNER_TEMP/release-trust-roots/connector-command-signing-public-key.pem"
          cmp packaging/release/trust-roots/release-manifest-signing-public-key.pem \
            "$RUNNER_TEMP/release-trust-roots/release-manifest-signing-public-key.pem"
          source_epoch=$(git show -s --format=%ct "$GITHUB_SHA")
          current_epoch=$(date -u +%s)
          [[ $source_epoch =~ ^[0-9]+$ ]]
          (( source_epoch <= current_epoch + 300 ))
          input_root="$RUNNER_TEMP/release-manifest-input"
          mkdir -p "$input_root"
          bun packaging/release/release-manifest-cli.ts prepare \
            --artifacts-dir "$RUNNER_TEMP/release-assets" \
            --version "$VERSION" \
            --release-id "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" \
            --source-epoch "$source_epoch" \
            --validity-days 365 \
            --manifest-output "$input_root/release-manifest.json" \
            --payload-output "$input_root/release-manifest-payload.bin"
          manifest_sha=$(sha256sum "$input_root/release-manifest.json" | cut -d ' ' -f 1)
          payload_sha=$(sha256sum "$input_root/release-manifest-payload.bin" | cut -d ' ' -f 1)
          manifest_size=$(stat -c %s "$input_root/release-manifest.json")
          payload_size=$(stat -c %s "$input_root/release-manifest-payload.bin")
          cat > "$input_root/RELEASE-MANIFEST-INPUT.txt" <<RECEIPT
          schema=project-space.release-manifest-input/v1
          source-sha=$GITHUB_SHA
          source-ref=$GITHUB_REF_NAME
          version=$VERSION
          release-id=$GITHUB_REF_NAME
          manifest-sha256=$manifest_sha
          manifest-size=$manifest_size
          payload-sha256=$payload_sha
          payload-size=$payload_size
          RECEIPT
          (
            cd "$input_root"
            printf '%s  %s\n' \
              "$manifest_sha" release-manifest.json \
              "$payload_sha" release-manifest-payload.bin \
              > SHA256SUMS.txt
            sha256sum --check --strict SHA256SUMS.txt
          )

      - name: Resolve prepared artifact name
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "artifact-name=project-space-release-manifest-input-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Upload immutable manifest input
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.metadata.outputs.artifact-name }}
          path: ${{ runner.temp }}/release-manifest-input/*
          if-no-files-found: error
          overwrite: false
          retention-days: 2

  manifest-sign:
    name: Sign release manifest in isolation
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [manifest-prepare, trust-roots]
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/release-manifest-sign.yml
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
    with:
      prepared-artifact-digest: ${{ needs.manifest-prepare.outputs.artifact-digest }}
      prepared-artifact-id: ${{ needs.manifest-prepare.outputs.artifact-id }}
      prepared-artifact-name: ${{ needs.manifest-prepare.outputs.artifact-name }}
      source-ref: ${{ github.ref_name }}
      source-sha: ${{ github.sha }}
      trust-root-artifact-digest: ${{ needs.trust-roots.outputs.artifact-digest }}
      trust-root-artifact-id: ${{ needs.trust-roots.outputs.artifact-id }}
      trust-root-artifact-name: ${{ needs.trust-roots.outputs.artifact-name }}
      version: ${{ needs.manifest-prepare.outputs.version }}

  release-finalize:
    name: Assemble and verify release handoff
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [quality, trust-roots, windows-x64, linux-x64, macos-arm64, manifest-prepare, manifest-sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-name: ${{ steps.metadata.outputs.artifact-name }}
      version: ${{ needs.quality.outputs.version }}

    steps:
      - name: Check out exact source without credentials
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download exact Windows handoff
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.windows-x64.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/release-windows

      - name: Download exact Linux handoff
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.linux-x64.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/release-linux

      - name: Download exact macOS handoff
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.macos-arm64.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/release-macos

      - name: Download exact public trust roots
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.trust-roots.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/release-trust-roots

      - name: Download exact prepared manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.manifest-prepare.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/release-manifest-input

      - name: Download exact manifest signature
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.manifest-sign.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/release-manifest-signature

      - name: Assemble and verify authenticated release
        env:
          VERSION: ${{ needs.quality.outputs.version }}
        run: |
          set -euo pipefail
          bash packaging/release/normalize-platform-artifacts.sh \
            "$VERSION" \
            "$RUNNER_TEMP/release-windows" \
            "$RUNNER_TEMP/release-linux" \
            "$RUNNER_TEMP/release-macos" \
            "$RUNNER_TEMP/release-assets"
          cmp packaging/release/trust-roots/connector-command-signing-public-key.pem \
            "$RUNNER_TEMP/release-trust-roots/connector-command-signing-public-key.pem"
          cmp packaging/release/trust-roots/release-manifest-signing-public-key.pem \
            "$RUNNER_TEMP/release-trust-roots/release-manifest-signing-public-key.pem"
          (
            cd "$RUNNER_TEMP/release-manifest-input"
            sha256sum --check --strict SHA256SUMS.txt
          )
          (
            cd "$RUNNER_TEMP/release-manifest-signature"
            sha256sum --check --strict SHA256SUMS.txt
          )
          grep -Fx "source-sha=$GITHUB_SHA" \
            "$RUNNER_TEMP/release-manifest-input/RELEASE-MANIFEST-INPUT.txt"
          grep -Fx "source-ref=$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/release-manifest-input/RELEASE-MANIFEST-INPUT.txt"
          grep -Fx "version=$VERSION" \
            "$RUNNER_TEMP/release-manifest-input/RELEASE-MANIFEST-INPUT.txt"
          grep -Fx "prepared-artifact-id=${{ needs.manifest-prepare.outputs.artifact-id }}" \
            "$RUNNER_TEMP/release-manifest-signature/RELEASE-MANIFEST-SIGNATURE.txt"
          grep -Fx "prepared-artifact-digest=${{ needs.manifest-prepare.outputs.artifact-digest }}" \
            "$RUNNER_TEMP/release-manifest-signature/RELEASE-MANIFEST-SIGNATURE.txt"
          manifest_path="$RUNNER_TEMP/release-assets/project-space-release-manifest.json"
          bun packaging/release/release-manifest-cli.ts assemble \
            --manifest "$RUNNER_TEMP/release-manifest-input/release-manifest.json" \
            --payload "$RUNNER_TEMP/release-manifest-input/release-manifest-payload.bin" \
            --signature "$RUNNER_TEMP/release-manifest-signature/release-manifest-signature.bin" \
            --public-key "$RUNNER_TEMP/release-trust-roots/release-manifest-signing-public-key.pem" \
            --output "$manifest_path"
          verification_now=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
          while IFS='|' read -r target filename; do
            bun packaging/release/release-manifest-cli.ts verify \
              --manifest "$manifest_path" \
              --public-key "$RUNNER_TEMP/release-trust-roots/release-manifest-signing-public-key.pem" \
              --target "$target" \
              --release-id "$GITHUB_REF_NAME" \
              --artifact "$RUNNER_TEMP/release-assets/$filename" \
              --now "$verification_now"
          done <<TARGETS
          darwin-arm64|project-space-machine-tools-darwin-arm64-v${VERSION}.tar.gz
          linux-x64|project-space-machine-tools-linux-x64-v${VERSION}.tar.gz
          windows-x64|project-space-machine-tools-windows-x64-setup.exe
          TARGETS
          for target in darwin-arm64 linux-x64; do
            archive="$RUNNER_TEMP/release-assets/project-space-machine-tools-${target}-v${VERSION}.tar.gz"
            bundle="project-space-machine-tools-${target}-v${VERSION}"
            tar -xOf "$archive" "$bundle/connector-command-signing-public-key.pem" | \
              cmp - "$RUNNER_TEMP/release-trust-roots/connector-command-signing-public-key.pem"
            tar -xOf "$archive" "$bundle/release-manifest-signing-public-key.pem" | \
              cmp - "$RUNNER_TEMP/release-trust-roots/release-manifest-signing-public-key.pem"
          done
          bash packaging/release/create-publish-handoff.sh \
            "$VERSION" \
            "$GITHUB_SHA" \
            "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/release-assets" \
            "$manifest_path" \
            "$RUNNER_TEMP/publish-handoff"

      - name: Resolve final handoff name
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "artifact-name=project-space-github-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Upload immutable release handoff
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.metadata.outputs.artifact-name }}
          path: ${{ runner.temp }}/publish-handoff/*
          if-no-files-found: error
          overwrite: false
          retention-days: 2

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: release-finalize
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/release-publish.yml
    with:
      final-handoff-artifact-digest: ${{ needs.release-finalize.outputs.artifact-digest }}
      final-handoff-artifact-id: ${{ needs.release-finalize.outputs.artifact-id }}
      final-handoff-artifact-name: ${{ needs.release-finalize.outputs.artifact-name }}
      source-ref: ${{ github.ref_name }}
      source-sha: ${{ github.sha }}
      version: ${{ needs.release-finalize.outputs.version }}
