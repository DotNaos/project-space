name: Release

on:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'cmd/project/**'
      - 'go.mod'
      - 'go.sum'
      - 'internal/machineconnect/**'
      - 'internal/projectrun/**'
      - 'package.json'
      - 'bun.lock'
      - 'packaging/linux/**'
      - 'packaging/macos/**'
      - 'packaging/release/**'
      - 'packaging/windows/**'
      - 'server/**'
      - 'tests/**'
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Cross-platform quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test and build TypeScript
        run: |
          bun run check
          bun test
          bun run build

      - name: Test and vet Go
        run: |
          go test -race ./...
          go vet ./...

  trust-roots:
    name: Derive connector trust roots
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Load release trust keys from 1Password
        if: github.ref_type == 'tag'
        id: trust-secrets
        uses: 1password/load-secrets-action@3a12b0ab99d9cd590a3e9b5a90ea017210ed9556 # v4
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          PROJECT_CONNECTOR_COMMAND_SIGNING_PRIVATE_KEY_B64: op://projects/project-connector-command-signing-key/private_key_b64
          PROJECT_RELEASE_MANIFEST_SIGNING_PRIVATE_KEY_B64: op://projects/project-space-release-manifest-signing-key/private_key_b64
          PROJECT_RELEASE_MANIFEST_SIGNING_PUBLIC_KEY_B64: op://projects/project-space-release-manifest-signing-key/public_key_b64

      - name: Derive release trust roots
        if: github.ref_type == 'tag'
        env:
          PROJECT_CONNECTOR_COMMAND_SIGNING_PRIVATE_KEY_B64: ${{ steps.trust-secrets.outputs.PROJECT_CONNECTOR_COMMAND_SIGNING_PRIVATE_KEY_B64 }}
          PROJECT_RELEASE_MANIFEST_SIGNING_PRIVATE_KEY_B64: ${{ steps.trust-secrets.outputs.PROJECT_RELEASE_MANIFEST_SIGNING_PRIVATE_KEY_B64 }}
        run: >-
          bun packaging/release/derive-trust-roots.ts derive
          "$RUNNER_TEMP/connector-runtime-trust-roots"

      - name: Confirm stored release trust root
        if: github.ref_type == 'tag'
        env:
          PROJECT_RELEASE_MANIFEST_SIGNING_PUBLIC_KEY_B64: ${{ steps.trust-secrets.outputs.PROJECT_RELEASE_MANIFEST_SIGNING_PUBLIC_KEY_B64 }}
        run: |
          set -euo pipefail
          stored_public_key="$RUNNER_TEMP/stored-release-manifest-signing-public-key.pem"
          trap 'rm -f "$stored_public_key"' EXIT
          umask 077
          printf '%s' "$PROJECT_RELEASE_MANIFEST_SIGNING_PUBLIC_KEY_B64" | \
            base64 --decode > "$stored_public_key"
          cmp "$stored_public_key" \
            "$RUNNER_TEMP/connector-runtime-trust-roots/release-manifest-signing-public-key.pem"

      - name: Create disposable validation trust roots
        if: github.ref_type != 'tag'
        run: >-
          bun packaging/release/derive-trust-roots.ts validation-only
          "$RUNNER_TEMP/connector-runtime-trust-roots"

      - name: Validate public trust roots
        run: |
          bun -e '
            const { createPublicKey } = require("node:crypto");
            const { readFileSync } = require("node:fs");
            for (const name of [
              "connector-command-signing-public-key.pem",
              "release-manifest-signing-public-key.pem"
            ]) {
              const key = createPublicKey(readFileSync(`${process.env.RUNNER_TEMP}/connector-runtime-trust-roots/${name}`));
              if (key.type !== "public" || key.asymmetricKeyType !== "ed25519") process.exit(65);
            }
          '

      - name: Upload public trust roots
        uses: actions/upload-artifact@v4
        with:
          name: connector-runtime-trust-roots
          if-no-files-found: error
          path: ${{ runner.temp }}/connector-runtime-trust-roots/*.pem

  windows-x64:
    name: Windows x64 machine tools
    needs: quality
    runs-on: windows-2025
    timeout-minutes: 45
    outputs:
      artifact-name: ${{ steps.version.outputs.artifact-name }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Resolve and verify release version
        id: version
        shell: powershell
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($packageVersion -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw "package.json contains an invalid release version: $packageVersion"
          }
          if ('${{ github.ref_type }}' -eq 'tag') {
            $tag = '${{ github.ref_name }}'
            if ($tag -ne "v$packageVersion") {
              throw "Tag $tag does not match package.json version $packageVersion."
            }
          }
          "VERSION=$packageVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "version=$packageVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "artifact-name=project-space-machine-tools-windows-x64-v$packageVersion" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Windows release checks
        shell: powershell
        run: |
          bun run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun test tests/windows-release-version.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./cmd/project -run 'Windows|ConnectorMachineService|AuthenticatedConnector|ConnectorInstallerResolution|ConnectorBinaryName|UsableConnectorBinary|ConnectorRun|ConnectorCommandRegistersAuthenticatedRun|RootCommandPrintsBuildVersion'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./internal/machineconnect
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./cmd/project ./internal/machineconnect
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\packaging\windows\test-release-packaging.ps1

      - name: Build native Windows binaries
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path dist\windows -Force | Out-Null
          bun run build:connector:windows-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:CGO_ENABLED = '0'
          $ldflags = "-s -w -X main.projectMachineClientVersion=$env:VERSION -X main.projectMachineClientReleaseID=v$env:VERSION -X main.projectMachineClientBuildID=$env:GITHUB_SHA -X main.projectSpaceMachineBackendURL=https://projects.os-home.net"
          go build -trimpath -ldflags $ldflags -o dist\windows\project.exe .\cmd\project
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install verified Inno Setup compiler
        shell: powershell
        run: |
          $compiler = & .\packaging\windows\install-inno-setup.ps1 `
            -DestinationDirectory "$env:RUNNER_TEMP\inno-setup-6.7.3"
          "INNO_COMPILER=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build the per-user installer
        shell: powershell
        run: |
          & .\packaging\windows\build-installer.ps1 `
            -Version $env:VERSION `
            -SourceDirectory dist\windows `
            -CompilerPath $env:INNO_COMPILER

      - name: Hash installer and render WinGet manifests
        id: package
        shell: powershell
        run: |
          $installerName = 'project-space-machine-tools-windows-x64-setup.exe'
          $installerPath = Join-Path (Resolve-Path dist\windows).Path $installerName
          if (-not (Test-Path -LiteralPath $installerPath)) {
            throw "Installer was not created: $installerPath"
          }
          $sha256 = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA256).Hash
          $checksumLine = $sha256.ToLowerInvariant() + '  ' + $installerName + "`n"
          $utf8WithoutBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText(
            (Join-Path (Resolve-Path dist\windows).Path 'SHA256SUMS.txt'),
            $checksumLine,
            $utf8WithoutBom
          )
          $installerUrl = "https://github.com/${{ github.repository }}/releases/download/v$env:VERSION/$installerName"
          $manifestDirectory = & .\packaging\windows\render-winget-manifests.ps1 `
            -Version $env:VERSION `
            -InstallerUrl $installerUrl `
            -InstallerSha256 $sha256 `
            -OutputDirectory dist\winget
          "manifest-directory=$manifestDirectory" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Validate WinGet manifests
        shell: powershell
        run: |
          winget --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The hosted image can lag behind the schema required by winget-pkgs.
          # Suppress only validation warnings; manifest errors still return non-zero.
          winget validate --ignore-warnings '${{ steps.package.outputs.manifest-directory }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact-name }}
          if-no-files-found: error
          path: |
            dist/windows/project-space-machine-tools-windows-x64-setup.exe
            dist/windows/SHA256SUMS.txt
            dist/winget/manifests/d/DotNaos/Project/${{ steps.version.outputs.version }}/*.yaml

  linux-x64:
    name: Linux x64 machine tools
    needs:
      - quality
      - trust-roots
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact-name: ${{ steps.version.outputs.artifact-name }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Resolve and verify release version
        id: version
        shell: bash
        env:
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          package_version=$(bun -e "console.log(require('./package.json').version)")
          if [[ ! $package_version =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "package.json contains an invalid release version: $package_version" >&2
            exit 1
          fi
          if [[ $RELEASE_REF_TYPE == tag && $RELEASE_REF_NAME != "v${package_version}" ]]; then
            echo "Tag $RELEASE_REF_NAME does not match package.json version $package_version." >&2
            exit 1
          fi
          echo "VERSION=$package_version" >> "$GITHUB_ENV"
          echo "version=$package_version" >> "$GITHUB_OUTPUT"
          echo "artifact-name=project-space-machine-tools-linux-x64-v$package_version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Linux release checks
        run: |
          bash -n packaging/linux/*.sh
          packaging/linux/test-release-packaging.sh "$VERSION"
          go test ./cmd/project -run 'ConnectorMachineService|AuthenticatedConnector|ConnectorBinaryName|UsableConnectorBinary|ConnectorRun|ConnectorCommandRegistersAuthenticatedRun|RootCommandPrintsBuildVersion'
          go test ./internal/machineconnect
          go vet ./cmd/project ./internal/machineconnect

      - name: Build native Linux binaries
        run: |
          mkdir -p dist/linux
          bun packaging/release/build-connector.ts \
            bun-linux-x64 \
            dist/linux/project-space-connector
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -trimpath \
            -ldflags "-s -w -X main.projectMachineClientVersion=$VERSION -X main.projectMachineClientReleaseID=v$VERSION -X main.projectMachineClientBuildID=$GITHUB_SHA -X main.projectSpaceMachineBackendURL=https://projects.os-home.net" \
            -o dist/linux/project \
            ./cmd/project

      - name: Download release trust roots
        uses: actions/download-artifact@v4
        with:
          name: connector-runtime-trust-roots
          path: dist/linux

      - name: Build and hash deterministic bundle
        run: |
          SOURCE_DATE_EPOCH=0 packaging/linux/build-machine-tools.sh \
            "$VERSION" \
            dist/linux \
            dist/linux-release

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact-name }}
          if-no-files-found: error
          path: |
            dist/linux-release/project-space-machine-tools-linux-x64-v${{ steps.version.outputs.version }}.tar.gz
            dist/linux-release/project-space-machine-tools-linux-x64-v${{ steps.version.outputs.version }}.tar.gz.sha256

  macos-arm64:
    name: macOS arm64 machine tools
    needs:
      - quality
      - trust-roots
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      artifact-name: ${{ steps.version.outputs.artifact-name }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Resolve and verify release version
        id: version
        shell: bash
        env:
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          package_version=$(awk -F '"' '/"version"/ { print $4; exit }' package.json)
          if [[ ! $package_version =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "package.json contains an invalid release version: $package_version" >&2
            exit 1
          fi
          if [[ $RELEASE_REF_TYPE == tag && $RELEASE_REF_NAME != "v${package_version}" ]]; then
            echo "Tag $RELEASE_REF_NAME does not match package.json version $package_version." >&2
            exit 1
          fi
          echo "VERSION=$package_version" >> "$GITHUB_ENV"
          echo "version=$package_version" >> "$GITHUB_OUTPUT"
          echo "artifact-name=project-space-machine-tools-darwin-arm64-v$package_version" >> "$GITHUB_OUTPUT"

      - name: Run macOS packaging checks
        run: |
          bash -n packaging/macos/*.sh
          packaging/macos/test-release-packaging.sh "$VERSION"

      - name: Set up Go
        if: github.ref_type == 'tag'
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        if: github.ref_type == 'tag'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        if: github.ref_type == 'tag'
        run: bun install --frozen-lockfile

      - name: Download release trust roots
        if: github.ref_type == 'tag'
        uses: actions/download-artifact@v4
        with:
          name: connector-runtime-trust-roots
          path: dist

      - name: Load macOS signing certificate from 1Password
        if: github.ref_type == 'tag'
        id: signing-secrets
        uses: 1password/load-secrets-action@3a12b0ab99d9cd590a3e9b5a90ea017210ed9556 # v4
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          MACOS_SIGNING_CERTIFICATE_P12_B64: op://projects/Project Space macOS Release Signing/certificate_p12_b64
          MACOS_SIGNING_CERTIFICATE_PASSWORD: op://projects/Project Space macOS Release Signing/password

      - name: Install isolated macOS signing identity
        if: github.ref_type == 'tag'
        env:
          CERTIFICATE_P12_B64: ${{ steps.signing-secrets.outputs.MACOS_SIGNING_CERTIFICATE_P12_B64 }}
          CERTIFICATE_PASSWORD: ${{ steps.signing-secrets.outputs.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          [[ $(uname -m) == arm64 ]] || { echo 'The macOS release runner must be arm64.' >&2; exit 69; }
          keychain="$RUNNER_TEMP/project-space-release.keychain-db"
          keychain_password=$(openssl rand -hex 32)
          printf '%s' "$CERTIFICATE_P12_B64" | /usr/bin/base64 -D > "$RUNNER_TEMP/project-space-release.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/project-space-release.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          identity=$(security find-identity -v -p codesigning "$keychain" | awk '/[0-9A-F]{40}/ { print $2; exit }')
          [[ $identity =~ ^[0-9A-F]{40}$ ]] || { echo 'No valid code-signing identity was imported.' >&2; exit 78; }
          echo "PROJECT_MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build and validate signed macOS bundle
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          bun run build:machine-tools:macos-arm64
          codesign --verify --strict --test-requirement '=anchor apple generic and certificate leaf[subject.OU] = "R72P4M9WMS" and identifier "com.dotnaos.project.approval-signer"' dist/project-approval-signer
          shasum -a 256 -c "dist/macos-release/project-space-machine-tools-darwin-arm64-v${VERSION}.tar.gz.sha256"

      - name: Remove isolated macOS signing identity
        if: always() && github.ref_type == 'tag'
        run: |
          security delete-keychain "$RUNNER_TEMP/project-space-release.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/project-space-release.p12"

      - name: Upload release artifacts
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact-name }}
          if-no-files-found: error
          path: |
            dist/macos-release/project-space-machine-tools-darwin-arm64-v${{ steps.version.outputs.version }}.tar.gz
            dist/macos-release/project-space-machine-tools-darwin-arm64-v${{ steps.version.outputs.version }}.tar.gz.sha256

  publish:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs:
      - windows-x64
      - linux-x64
      - macos-arm64
      - trust-roots
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Download verified release artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.windows-x64.outputs.artifact-name }}
          path: release-assets

      - name: Download verified Linux release artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.linux-x64.outputs.artifact-name }}
          path: release-assets

      - name: Download verified macOS release artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.macos-arm64.outputs.artifact-name }}
          path: release-assets

      - name: Download release trust roots
        uses: actions/download-artifact@v4
        with:
          name: connector-runtime-trust-roots
          path: release-trust-roots

      - name: Load release manifest signing key from 1Password
        id: manifest-secrets
        uses: 1password/load-secrets-action@3a12b0ab99d9cd590a3e9b5a90ea017210ed9556 # v4
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          PROJECT_RELEASE_MANIFEST_SIGNING_PRIVATE_KEY_B64: op://projects/project-space-release-manifest-signing-key/private_key_b64

      - name: Create and verify authenticated release manifest
        env:
          PROJECT_RELEASE_MANIFEST_SIGNING_PRIVATE_KEY_B64: ${{ steps.manifest-secrets.outputs.PROJECT_RELEASE_MANIFEST_SIGNING_PRIVATE_KEY_B64 }}
          VERSION: ${{ needs.linux-x64.outputs.version }}
        run: |
          set -euo pipefail
          source_epoch=$(git show -s --format=%ct "$GITHUB_SHA")
          verification_now=$(bun -e \
            'console.log(new Date(Number(process.argv[1]) * 1000).toISOString())' \
            "$source_epoch")
          bun packaging/release/release-manifest-cli.ts create \
            --artifacts-dir release-assets \
            --version "$VERSION" \
            --release-id "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" \
            --source-epoch "$source_epoch" \
            --validity-days 365 \
            --output release-assets/project-space-release-manifest.json \
            --public-key-output "$RUNNER_TEMP/project-space-release-manifest-public-key.pem"
          while IFS='|' read -r target filename; do
            artifact=$(find release-assets -type f -name "$filename" -print -quit)
            [[ -n $artifact ]] || { echo "Missing manifest artifact: $filename" >&2; exit 66; }
            bun packaging/release/release-manifest-cli.ts verify \
              --manifest release-assets/project-space-release-manifest.json \
              --public-key "$RUNNER_TEMP/project-space-release-manifest-public-key.pem" \
              --target "$target" \
              --release-id "$GITHUB_REF_NAME" \
              --artifact "$artifact" \
              --now "$verification_now"
          done <<TARGETS
          darwin-arm64|project-space-machine-tools-darwin-arm64-v${VERSION}.tar.gz
          linux-x64|project-space-machine-tools-linux-x64-v${VERSION}.tar.gz
          windows-x64|project-space-machine-tools-windows-x64-setup.exe
          TARGETS
          cmp "$RUNNER_TEMP/project-space-release-manifest-public-key.pem" \
            release-trust-roots/release-manifest-signing-public-key.pem
          for target in darwin-arm64 linux-x64; do
            archive="release-assets/project-space-machine-tools-${target}-v${VERSION}.tar.gz"
            bundle="project-space-machine-tools-${target}-v${VERSION}"
            tar -xOf "$archive" "$bundle/connector-command-signing-public-key.pem" | \
              cmp - release-trust-roots/connector-command-signing-public-key.pem
            tar -xOf "$archive" "$bundle/release-manifest-signing-public-key.pem" | \
              cmp - release-trust-roots/release-manifest-signing-public-key.pem
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t assets < <(find release-assets -type f -print | sort)
          if [ "${#assets[@]}" -ne 10 ]; then
            echo "Expected ten release assets, found ${#assets[@]}." >&2
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            "${assets[@]}"
