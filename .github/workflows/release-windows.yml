name: Isolated Windows release

on:
  workflow_call:
    inputs:
      source-sha:
        description: Exact source commit to build and bind into the artifact.
        required: true
        type: string
      version:
        description: Semantic release version without the v prefix.
        required: true
        type: string
    outputs:
      artifact-digest:
        description: GitHub-recorded SHA-256 digest of the Windows release artifact.
        value: ${{ jobs.build.outputs.artifact-digest }}
      artifact-id:
        description: Immutable ID of the Windows release artifact.
        value: ${{ jobs.build.outputs.artifact-id }}
      artifact-name:
        description: Deterministic Windows release artifact name.
        value: ${{ jobs.build.outputs.artifact-name }}
      version:
        description: Validated release version.
        value: ${{ jobs.build.outputs.version }}

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64 machine tools
    runs-on: windows-2025
    timeout-minutes: 45
    outputs:
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-name: ${{ steps.version.outputs.artifact-name }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate exact release contract
        shell: powershell
        run: |
          $sourceSha = '${{ inputs.source-sha }}'
          $version = '${{ inputs.version }}'
          if ($sourceSha -notmatch '^[0-9a-f]{40}$' -or $sourceSha -ne $env:GITHUB_SHA) {
            throw "Windows release source identity is invalid."
          }
          if ($version -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw "Windows release version is invalid: $version"
          }
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -ne "v$version") {
            throw "Tag ${{ github.ref_name }} does not match version $version."
          }

      - name: Check out exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Restore exact Bun package downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-1.3.14-${{ hashFiles('bun.lock') }}

      - name: Resolve and verify release version
        id: version
        shell: powershell
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($packageVersion -ne '${{ inputs.version }}') {
            throw "Windows release version $packageVersion does not match the proven version."
          }
          if ((git rev-parse HEAD) -ne '${{ inputs.source-sha }}') {
            throw "Checked-out Windows source does not match the proven source."
          }
          "VERSION=$packageVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "version=$packageVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "artifact-name=project-space-machine-tools-windows-x64-v$packageVersion" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Windows release checks
        shell: powershell
        run: |
          bun test tests/windows-release-version.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./cmd/project -run 'Windows|SelfUpdate|ConnectorMachineService|AuthenticatedConnector|ConnectorInstallerResolution|ConnectorBinaryName|UsableConnectorBinary|ConnectorRun|ConnectorCommandRegistersAuthenticatedRun|RootCommandPrintsBuildVersion'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./internal/selfupdate -run 'Manifest|GitHub|Windows|InstallationTarget'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./internal/machineconnect
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./cmd/project ./internal/machineconnect ./internal/selfupdate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\packaging\windows\test-release-packaging.ps1

      - name: Build native Windows binaries
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path dist\windows -Force | Out-Null
          bun run build:connector:windows-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:CGO_ENABLED = '0'
          $ldflags = "-s -w -X main.projectMachineClientVersion=$env:VERSION -X main.projectMachineClientReleaseID=v$env:VERSION -X main.projectMachineClientBuildID=$env:GITHUB_SHA -X main.projectSpaceMachineBackendURL=https://projects.os-home.net"
          go build -trimpath -ldflags $ldflags -o dist\windows\project.exe .\cmd\project
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install verified Inno Setup compiler
        shell: powershell
        run: |
          $compiler = & .\packaging\windows\install-inno-setup.ps1 `
            -DestinationDirectory "$env:RUNNER_TEMP\inno-setup-6.7.3"
          "INNO_COMPILER=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build the per-user installer
        shell: powershell
        run: |
          & .\packaging\windows\build-installer.ps1 `
            -Version $env:VERSION `
            -SourceDirectory dist\windows `
            -CompilerPath $env:INNO_COMPILER

      - name: Hash installer and render WinGet manifests
        id: package
        shell: powershell
        run: |
          $installerName = 'project-space-machine-tools-windows-x64-setup.exe'
          $installerPath = Join-Path (Resolve-Path dist\windows).Path $installerName
          if (-not (Test-Path -LiteralPath $installerPath)) {
            throw "Installer was not created: $installerPath"
          }
          $sha256 = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA256).Hash
          $checksumLine = $sha256.ToLowerInvariant() + '  ' + $installerName + "`n"
          $utf8WithoutBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText(
            (Join-Path (Resolve-Path dist\windows).Path 'SHA256SUMS.txt'),
            $checksumLine,
            $utf8WithoutBom
          )
          $installerUrl = "https://github.com/${{ github.repository }}/releases/download/v$env:VERSION/$installerName"
          $manifestDirectory = & .\packaging\windows\render-winget-manifests.ps1 `
            -Version $env:VERSION `
            -InstallerUrl $installerUrl `
            -InstallerSha256 $sha256 `
            -OutputDirectory dist\winget
          "manifest-directory=$manifestDirectory" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Validate WinGet manifests
        shell: powershell
        run: |
          winget --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The hosted image can lag behind the schema required by winget-pkgs.
          # Suppress only validation warnings; manifest errors still return non-zero.
          winget validate --ignore-warnings '${{ steps.package.outputs.manifest-directory }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload release artifacts
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.version.outputs.artifact-name }}
          if-no-files-found: error
          overwrite: false
          path: |
            dist/windows/project-space-machine-tools-windows-x64-setup.exe
            dist/windows/SHA256SUMS.txt
            dist/winget/manifests/d/DotNaos/Project/${{ steps.version.outputs.version }}/*.yaml
