name: Documentation integrity

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated-cli-docs:
    name: CLI documentation / Generated docs are current
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Enforce one versioned release entry
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            bun run docs:release:pr
          else
            bun run docs:release:check
          fi

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify generated CLI documentation
        run: |
          go test ./cmd/project -run 'CLIDocs|RootCommandIncludesExpectedCommands'
          bun run docs:cli:check

      - name: Install documentation dependencies
        working-directory: apps/docs
        run: bun install --frozen-lockfile

      - name: Type-check and build documentation
        run: |
          bun run docs:typecheck
          bun run docs:build
