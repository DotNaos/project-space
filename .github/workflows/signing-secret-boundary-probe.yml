name: Signing secret boundary probe

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Secret boundary to verify.
        required: true
        default: reusable-environment
        type: choice
        options:
          - direct-environment
          - reusable-environment
          - reusable-explicit-named

permissions: {}

jobs:
  direct-environment:
    name: Direct protected environment control
    if: ${{ inputs.variant == 'direct-environment' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    environment: release-signing

    steps:
      - name: Require a non-empty service-account token
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          if [[ -z ${OP_SERVICE_ACCOUNT_TOKEN:-} ]]; then
            /usr/bin/printf 'Protected environment secret is unavailable.\n' >&2
            exit 1
          fi
          /usr/bin/printf 'Protected environment secret is available.\n'

  reusable-environment:
    name: Reusable workflow environment lookup
    if: ${{ inputs.variant == 'reusable-environment' }}
    permissions: {}
    uses: ./.github/workflows/signing-secret-boundary-probe-reusable.yml

  reusable-explicit-named:
    name: Reusable workflow named forwarding
    if: ${{ inputs.variant == 'reusable-explicit-named' }}
    permissions: {}
    uses: ./.github/workflows/signing-secret-boundary-probe-reusable.yml
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
