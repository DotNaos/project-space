name: Isolated macOS release

on:
  workflow_call:
    inputs:
      source-sha:
        description: Exact source commit to build and bind into every artifact.
        required: true
        type: string
      version:
        description: Semantic release version without the v prefix.
        required: true
        type: string
      trust-artifact-id:
        description: Immutable Actions artifact ID containing the public trust roots.
        required: true
        type: string
      trust-artifact-digest:
        description: GitHub-recorded SHA-256 digest for the trust-root artifact.
        required: true
        type: string
      trust-artifact-name:
        description: Fixed trust-root artifact name.
        required: true
        type: string
    outputs:
      artifact-id:
        description: Immutable ID of the final macOS release artifact.
        value: ${{ jobs.package.outputs.artifact-id }}
      artifact-digest:
        description: GitHub-recorded SHA-256 digest of the final artifact.
        value: ${{ jobs.package.outputs.artifact-digest }}
      artifact-name:
        description: Deterministic final artifact name.
        value: ${{ jobs.package.outputs.artifact-name }}
      version:
        description: Validated release version.
        value: ${{ jobs.package.outputs.version }}

permissions:
  actions: read
  contents: read

jobs:
  runtime:
    name: Build macOS arm64 runtime
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      artifact-name: ${{ steps.contract.outputs.artifact-name }}
      version: ${{ steps.contract.outputs.version }}
    steps:
      - name: Capture the protected release test harness
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Preserve the current macOS packaging test
        run: |
          set -euo pipefail
          install -m 0755 packaging/macos/test-release-packaging.sh "$RUNNER_TEMP/test-release-packaging.sh"
          install -m 0644 packaging/macos/testdata/v0.21.23-updater-contract_test.go \
            "$RUNNER_TEMP/v0.21.23-updater-contract_test.go"

      - name: Validate release contract
        id: contract
        shell: bash
        env:
          RELEASE_SOURCE_SHA: ${{ inputs.source-sha }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ $RELEASE_SOURCE_SHA =~ ^[0-9a-f]{40}$ ]]
          [[ $RELEASE_VERSION =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          echo "artifact-name=project-space-macos-runtime-v${RELEASE_VERSION}-${RELEASE_SOURCE_SHA}" >> "$GITHUB_OUTPUT"
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Check out exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.source-sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checked-out source
        env:
          RELEASE_SOURCE_SHA: ${{ inputs.source-sha }}
        run: |
          set -euo pipefail
          [[ $(git rev-parse HEAD) == "$RELEASE_SOURCE_SHA" ]]
          [[ $(uname -m) == arm64 ]]
          bash -n packaging/macos/*.sh

      - name: Use the protected recovery-compatible test harness
        run: |
          set -euo pipefail
          install -m 0755 "$RUNNER_TEMP/test-release-packaging.sh" packaging/macos/test-release-packaging.sh
          mkdir -p packaging/macos/testdata
          install -m 0644 "$RUNNER_TEMP/v0.21.23-updater-contract_test.go" \
            packaging/macos/testdata/v0.21.23-updater-contract_test.go

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run macOS release checks
        run: |
          set -euo pipefail
          go test ./cmd/project -run 'SelfUpdate|RootCommandPrintsBuildVersion'
          go test ./internal/selfupdate
          go vet ./cmd/project ./internal/selfupdate
          packaging/macos/test-release-packaging.sh '${{ inputs.version }}'

      - name: Build arm64 Codex host
        env:
          PROJECT_RELEASE_SOURCE_SHA: ${{ inputs.source-sha }}
          RELEASE_ID: v${{ inputs.version }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          bun packaging/release/build-codex-host.ts \
            bun-darwin-arm64 \
            dist/project-codex-host
          bash packaging/macos/prepare-unsigned-release-artifact.sh \
            '${{ inputs.version }}' \
            '${{ inputs.source-sha }}' \
            dist/project-codex-host \
            "$RUNNER_TEMP/project-space-macos-runtime"

      - name: Upload immutable runtime
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.contract.outputs.artifact-name }}
          path: ${{ runner.temp }}/project-space-macos-runtime/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  package:
    name: Package verified macOS machine tools
    needs: runtime
    runs-on: macos-15
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      artifact-name: ${{ steps.contract.outputs.artifact-name }}
      version: ${{ inputs.version }}
    steps:
      - name: Validate immutable artifact metadata and release source
        id: contract
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          BASH_ENV: /dev/null
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          PATH: /usr/bin:/bin
          RELEASE_SOURCE_SHA: ${{ inputs.source-sha }}
          RELEASE_VERSION: ${{ inputs.version }}
          RUNTIME_ARTIFACT_ID: ${{ needs.runtime.outputs.artifact-id }}
          RUNTIME_ARTIFACT_DIGEST: ${{ needs.runtime.outputs.artifact-digest }}
          RUNTIME_ARTIFACT_NAME: ${{ needs.runtime.outputs.artifact-name }}
          TRUST_ARTIFACT_ID: ${{ inputs.trust-artifact-id }}
          TRUST_ARTIFACT_DIGEST: ${{ inputs.trust-artifact-digest }}
          TRUST_ARTIFACT_NAME: ${{ inputs.trust-artifact-name }}
        run: |
          [[ $DEFAULT_BRANCH == main ]]
          [[ $RELEASE_SOURCE_SHA =~ ^[0-9a-f]{40}$ ]]
          [[ $RELEASE_VERSION =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          expected_runtime_name="project-space-macos-runtime-v${RELEASE_VERSION}-${RELEASE_SOURCE_SHA}"
          expected_trust_name="project-space-release-trust-roots-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RELEASE_SOURCE_SHA}"
          [[ $RUNTIME_ARTIFACT_NAME == "$expected_runtime_name" ]]
          [[ $TRUST_ARTIFACT_NAME == "$expected_trust_name" ]]

          api_config="$RUNNER_TEMP/project-space-github-api-config"
          trap '/bin/rm -f "$api_config" "$RUNNER_TEMP"/project-space-artifact-*.json "$RUNNER_TEMP"/project-space-source-*.json' EXIT
          umask 077
          /usr/bin/printf '%s\n' \
            'header = "Accept: application/vnd.github+json"' \
            "header = \"Authorization: Bearer ${GH_TOKEN}\"" \
            'header = "X-GitHub-Api-Version: 2022-11-28"' > "$api_config"

          validate_artifact() {
            local id=$1 expected_name=$2 expected_digest=$3 label=$4
            [[ $id =~ ^[1-9][0-9]*$ ]]
            [[ $expected_digest =~ ^[0-9a-f]{64}$ ]]
            local metadata="$RUNNER_TEMP/project-space-artifact-${label}.json"
            /usr/bin/curl --config "$api_config" --fail --location --silent --show-error \
              --output "$metadata" \
              --url "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
            [[ $(/usr/bin/plutil -extract id raw -o - "$metadata") == "$id" ]]
            [[ $(/usr/bin/plutil -extract name raw -o - "$metadata") == "$expected_name" ]]
            local artifact_digest
            artifact_digest=$(/usr/bin/plutil -extract digest raw -o - "$metadata")
            artifact_digest=${artifact_digest#sha256:}
            [[ $artifact_digest == "$expected_digest" ]]
            [[ $(/usr/bin/plutil -extract expired raw -o - "$metadata") == false ]]
            [[ $(/usr/bin/plutil -extract workflow_run.id raw -o - "$metadata") == "$GITHUB_RUN_ID" ]]
            [[ $(/usr/bin/plutil -extract workflow_run.head_sha raw -o - "$metadata") == "$GITHUB_SHA" ]]
          }
          validate_artifact "$RUNTIME_ARTIFACT_ID" "$RUNTIME_ARTIFACT_NAME" "$RUNTIME_ARTIFACT_DIGEST" runtime
          validate_artifact "$TRUST_ARTIFACT_ID" "$TRUST_ARTIFACT_NAME" "$TRUST_ARTIFACT_DIGEST" trust

          tag_metadata="$RUNNER_TEMP/project-space-source-tag.json"
          ancestry_metadata="$RUNNER_TEMP/project-space-source-ancestry.json"
          /usr/bin/curl --config "$api_config" --fail --location --silent --show-error \
            --output "$tag_metadata" \
            --url "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/v${RELEASE_VERSION}"
          /usr/bin/curl --config "$api_config" --fail --location --silent --show-error \
            --output "$ancestry_metadata" \
            --url "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/compare/${RELEASE_SOURCE_SHA}...main"
          [[ $(/usr/bin/plutil -extract sha raw -o - "$tag_metadata") == "$RELEASE_SOURCE_SHA" ]]
          ancestry_status=$(/usr/bin/plutil -extract status raw -o - "$ancestry_metadata")
          [[ $ancestry_status == ahead || $ancestry_status == identical ]]
          [[ $(/usr/bin/plutil -extract merge_base_commit.sha raw -o - "$ancestry_metadata") == "$RELEASE_SOURCE_SHA" ]]
          echo "artifact-name=project-space-machine-tools-darwin-arm64-v${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download exact runtime artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.runtime.outputs.artifact-id }}
          path: ${{ runner.temp }}/project-space-macos-runtime
          merge-multiple: true

      - name: Download exact trust-root artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ inputs.trust-artifact-id }}
          path: ${{ runner.temp }}/project-space-macos-trust
          merge-multiple: true

      - name: Check out exact source after artifact validation
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.source-sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Cross-bind, build, and validate final bundle
        env:
          RUNTIME_ARTIFACT_ID: ${{ needs.runtime.outputs.artifact-id }}
          RUNTIME_ARTIFACT_DIGEST: ${{ needs.runtime.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          [[ $(git rev-parse HEAD) == '${{ inputs.source-sha }}' ]]
          bash -n packaging/macos/*.sh
          bash packaging/macos/package-isolated-release-artifact.sh \
            '${{ inputs.version }}' \
            '${{ inputs.source-sha }}' \
            "$RUNTIME_ARTIFACT_ID" \
            "$RUNTIME_ARTIFACT_DIGEST" \
            "$RUNNER_TEMP/project-space-macos-runtime" \
            "$RUNNER_TEMP/project-space-macos-trust" \
            "$RUNNER_TEMP/project-space-macos-package-input" \
            "$RUNNER_TEMP/project-space-macos-release" \
            "$GITHUB_WORKSPACE"

      - name: Upload final verified macOS release artifact
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.contract.outputs.artifact-name }}
          path: |
            ${{ runner.temp }}/project-space-macos-release/project-space-machine-tools-darwin-arm64-v${{ inputs.version }}.tar.gz
            ${{ runner.temp }}/project-space-macos-release/project-space-machine-tools-darwin-arm64-v${{ inputs.version }}.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
