name: Publish merged release

on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: write
  pull-requests: read

concurrency:
  group: publish-merged-release
  cancel-in-progress: false

jobs:
  publish:
    name: Validate merge and start exact release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact merged revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Validate merged entry and create exact tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_AFTER_SHA: ${{ github.sha }}
          RELEASE_BEFORE_SHA: ${{ github.event.before }}
        run: bun scripts/publish-merged-release.ts

      - name: Start the immutable release pipeline once
        if: steps.release.outputs.release_required == 'true' && steps.release.outputs.release_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh workflow run release.yml --ref "$RELEASE_TAG"

      - name: Deploy an ordinary merged revision to Production
        if: steps.release.outputs.release_required != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MERGED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$MERGED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          gh workflow run deploy-production.yml --ref main -f commit="$MERGED_COMMIT"
