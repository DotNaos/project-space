name: Publish merged release

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: read

concurrency:
  group: publish-merged-release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: Validate merge and start exact release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact merged revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Reconcile exact merged releases
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_AFTER_SHA: ${{ github.sha }}
          RELEASE_EVENT_NAME: ${{ github.event_name }}
        run: bun scripts/publish-merged-release.ts

      - name: Deploy an ordinary merged revision to Production
        if: steps.release.outputs.ordinary_deploy_required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MERGED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$MERGED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          gh workflow run deploy-production.yml --ref main -f commit="$MERGED_COMMIT"
