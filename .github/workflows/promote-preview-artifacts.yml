name: Promote verified PR preview artifacts

on:
  workflow_call:
    inputs:
      artifact_digest:
        required: true
        type: string
      artifact_id:
        required: true
        type: string
      artifact_name:
        required: true
        type: string
      artifact_size:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      pr_number:
        required: true
        type: string
      source_run_attempt:
        required: true
        type: string
      source_run_id:
        required: true
        type: string
      source_workflow_ref:
        required: true
        type: string
      trusted_sha:
        required: true
        type: string
    outputs:
      docs_digest:
        value: ${{ jobs.promote.outputs.docs_digest }}
      gateway_digest:
        value: ${{ jobs.promote.outputs.gateway_digest }}
      prototype_digest:
        value: ${{ jobs.promote.outputs.prototype_digest }}
      web_digest:
        value: ${{ jobs.promote.outputs.web_digest }}

permissions:
  contents: read

env:
  PREVIEW_REPOSITORY: DotNaos/project-space

jobs:
  promote:
    name: Verify and promote without Preview credentials
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
      attestations: read
      contents: read
      packages: write
    outputs:
      docs_digest: ${{ steps.images.outputs.docs_digest }}
      gateway_digest: ${{ steps.gateway.outputs.gateway_digest }}
      prototype_digest: ${{ steps.images.outputs.prototype_digest }}
      web_digest: ${{ steps.images.outputs.web_digest }}
    steps:
      - name: Check out trusted main verification and gateway assets
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: trusted
          ref: ${{ inputs.trusted_sha }}
          persist-credentials: false
      - name: Revalidate GitHub artifact metadata and download raw archive
        env:
          ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          ARTIFACT_SIZE: ${{ inputs.artifact_size }}
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ inputs.head_sha }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          metadata=$(gh api "repos/$PREVIEW_REPOSITORY/actions/artifacts/$ARTIFACT_ID")
          jq -e \
            --arg digest "$ARTIFACT_DIGEST" \
            --arg name "$ARTIFACT_NAME" \
            --arg sha "$PR_HEAD_SHA" \
            --argjson artifact_id "$ARTIFACT_ID" \
            --argjson artifact_size "$ARTIFACT_SIZE" \
            --argjson repository_id "$GITHUB_REPOSITORY_ID" \
            --argjson run_id "$SOURCE_RUN_ID" '
              .id == $artifact_id and .name == $name and .expired == false and
              .size_in_bytes == $artifact_size and .digest == $digest and
              .workflow_run.id == $run_id and
              .workflow_run.repository_id == $repository_id and
              .workflow_run.head_repository_id == $repository_id and
              .workflow_run.head_sha == $sha
            ' <<<"$metadata" >/dev/null
          gh api \
            "repos/$PREVIEW_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            > "$RUNNER_TEMP/preview-artifact.zip"
      - name: Validate raw archive before bounded extraction
        env:
          ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
          ARTIFACT_SIZE: ${{ inputs.artifact_size }}
        run: |
          set -euo pipefail
          python3 trusted/scripts/preview-artifact-contract.py safe-extract \
            --archive "$RUNNER_TEMP/preview-artifact.zip" \
            --destination "$RUNNER_TEMP/preview-artifact" \
            --expected-digest "$ARTIFACT_DIGEST" \
            --expected-size "$ARTIFACT_SIZE"
      - name: Validate canonical manifest and every image archive
        env:
          PR_HEAD_SHA: ${{ inputs.head_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_WORKFLOW_REF: ${{ inputs.source_workflow_ref }}
        run: |
          set -euo pipefail
          python3 trusted/scripts/preview-artifact-contract.py verify \
            --root "$RUNNER_TEMP/preview-artifact" \
            --repository "$PREVIEW_REPOSITORY" \
            --repository-id "$GITHUB_REPOSITORY_ID" \
            --pr "$PR_NUMBER" \
            --head-sha "$PR_HEAD_SHA" \
            --workflow-ref "$SOURCE_WORKFLOW_REF" \
            --run-id "$SOURCE_RUN_ID" \
            --run-attempt "$SOURCE_RUN_ATTEMPT" \
            > "$RUNNER_TEMP/verified-preview-manifest.json"
      - name: Verify GitHub provenance for manifest and image archives
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          for file in manifest.json images/web.tar images/docs.tar images/prototype.tar; do
            gh attestation verify "$RUNNER_TEMP/preview-artifact/$file" \
              --repo "$PREVIEW_REPOSITORY" \
              --signer-workflow "$PREVIEW_REPOSITORY/.github/workflows/ci.yml" \
              --source-ref "refs/pull/$PR_NUMBER/merge" \
              --deny-self-hosted-runners >/dev/null
          done
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Sign in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Import and promote only verified exact-head image archives
        id: images
        env:
          PR_HEAD_SHA: ${{ inputs.head_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          for target in web docs prototype; do
            local_image="project-space-preview-$target:pr-$PR_NUMBER-$PR_HEAD_SHA"
            docker load --input "$RUNNER_TEMP/preview-artifact/images/$target.tar" >/dev/null
            [[ "$(docker image inspect "$local_image" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" == "$PR_HEAD_SHA" ]]
            [[ "$(docker image inspect "$local_image" --format '{{ index .Config.Labels "com.dotnaos.project-space.preview" }}')" == true ]]
            remote_image="ghcr.io/dotnaos/project-space-preview-$target:pr-$PR_NUMBER-$PR_HEAD_SHA-$SOURCE_RUN_ID-$SOURCE_RUN_ATTEMPT"
            docker tag "$local_image" "$remote_image"
            docker push "$remote_image" >/dev/null
            digest=$(docker buildx imagetools inspect "$remote_image" --format '{{.Manifest.Digest}}')
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            printf '%s_digest=%s\n' "$target" "$digest" >> "$GITHUB_OUTPUT"
          done
      - name: Build the credential-bearing gateway only from trusted main
        id: gateway
        env:
          TRUSTED_SHA: ${{ inputs.trusted_sha }}
        run: |
          set -euo pipefail
          metadata_file="$RUNNER_TEMP/preview-gateway-metadata.json"
          docker buildx build \
            --file trusted/deploy/preview.gateway.Dockerfile \
            --build-arg "PROJECT_SPACE_BUILD_COMMIT=$TRUSTED_SHA" \
            --tag "ghcr.io/dotnaos/project-space-preview-gateway:$TRUSTED_SHA" \
            --metadata-file "$metadata_file" \
            --push trusted
          digest=$(jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' "$metadata_file")
          echo "gateway_digest=$digest" >> "$GITHUB_OUTPUT"
